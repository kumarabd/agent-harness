{{- if .Values.router.enabled -}}
{{- if and (not .Values.router.clerkJwksUrl) (not .Values.router.clerkIssuer) }}
{{- fail "router.clerkJwksUrl or router.clerkIssuer is required when router.enabled=true — the router can't verify any session token without one." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "router") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "router") | nindent 4 }}
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "router") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent-harness.fullname" . }}
      # This process resolves tenants by pure convention and talks, per
      # request, to that tenant's own Gateway/agent-brain/mcp-hub
      # Services by DNS name — never the Kubernetes API itself, and
      # (2026-09-25) no database of any kind (router/main.go).
      automountServiceAccountToken: false
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag }}"
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.router.port }}
          env:
            - name: ROUTER_BIND_ADDRESS
              value: {{ printf "0.0.0.0:%d" (int .Values.router.port) | quote }}
            # Must match agent-harness-tenant/values.yaml's own gateway.port/
            # agent-brain subchart defaults — the router computes every
            # tenant's Service URL by convention now
            # (router/internal/core/tenant.go), no lookup table to
            # get this from instead.
            - name: TENANT_GATEWAY_PORT
              value: "8090"
            - name: TENANT_AGENT_BRAIN_PORT
              value: "8080"
            # Each tenant's own maps-engine Service (agent-harness-tenant's mapsEngine.port), reached at /maps/.
            - name: TENANT_MAPS_ENGINE_PORT
              value: "8080"
            # Each tenant's own finance-engine Service (agent-harness-tenant's financeEngine.port), reached at /finance/.
            - name: TENANT_FINANCE_ENGINE_PORT
              value: "8091"
            # Same non-secret JWKS-only verification as agent-harness-tenant's
            # gateway.web.clerkJwksUrl/clerkIssuer — see that chart's own
            # comment for the full reasoning (no Clerk secret key anywhere).
            {{- if .Values.router.clerkJwksUrl }}
            - name: CLERK_JWKS_URL
              value: {{ .Values.router.clerkJwksUrl | quote }}
            {{- end }}
            {{- if .Values.router.clerkIssuer }}
            - name: CLERK_ISSUER
              value: {{ .Values.router.clerkIssuer | quote }}
            {{- end }}
            # 2026-09-24 — the browser now calls this router directly
            # (agent-web's own nginx no longer reverse-proxies in front of
            # it, docs/components/gateway/web.md's "Resolved: Shared
            # agent-web + Identity-Routing Router"), making this genuinely
            # cross-origin traffic for the first time in this codebase.
            # Comma-separated exact origins, or "*" — same parsing as
            # gateway/internal/web/web.go's sibling
            # GATEWAY_WEB_ALLOWED_ORIGINS (router/internal/core/cors.go).
            {{- if .Values.router.allowedOrigins }}
            - name: ROUTER_ALLOWED_ORIGINS
              value: {{ join "," .Values.router.allowedOrigins | quote }}
            {{- end }}
            # Self-serve onboarding (cmd/router/main.go) — only wired up when
            # the automation worker this router hands onboarding requests to
            # actually exists. TEMPORAL_NAMESPACE/AUTOMATION_TASK_QUEUE must
            # match automation.temporalNamespace/taskQueue exactly (the same
            # "system" namespace/queue that worker itself runs on) — this
            # router talks to it purely by Temporal namespace/queue, never a
            # Kubernetes Service.
            {{- if .Values.automation.enabled }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.automation.temporalNamespace | quote }}
            - name: AUTOMATION_TASK_QUEUE
              value: {{ .Values.automation.taskQueue | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
      {{- with .Values.router.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
