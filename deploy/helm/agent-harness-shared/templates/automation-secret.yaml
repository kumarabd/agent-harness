{{- if .Values.automation.enabled -}}
{{- if not .Values.automation.clerkSecretKey }}
{{- fail "automation.clerkSecretKey is required when automation.enabled=true — CreateClerkOrganization can't create a Clerk Organization without it (workflows/internal/automation/activities/clerk.go)." }}
{{- end }}
# The FIRST real Clerk secret key anywhere in this codebase — every other
# Clerk integration (clerkauth.VerifyJWT, the router's own JWT verification)
# deliberately needs only the project's public JWKS. See clerk.go's own doc
# comment for why creating an Organization is the one legitimate exception.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "automation") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "automation") | nindent 4 }}
type: Opaque
stringData:
  clerk-secret-key: {{ .Values.automation.clerkSecretKey | quote }}
{{- end }}
