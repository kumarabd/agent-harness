{{- if .Values.automation.enabled -}}
{{- if not .Values.router.clerkIssuer }}
{{- fail "router.clerkIssuer is required when automation.enabled=true — every tenant this worker provisions gets that same shared issuer written into its own gateway.web.clerkIssuer (workflows/internal/automation/activities/helm.go, cmd/automation/main.go's own CLERK_ISSUER check). Unlike the router (which can verify tokens with just clerkJwksUrl), this worker needs the literal issuer string to embed into each generated tenant's config — clerkJwksUrl alone does not substitute here." }}
{{- end }}
{{- if not .Values.router.allowedOrigins }}
{{- fail "router.allowedOrigins is required when automation.enabled=true — every tenant this worker provisions gets it written into its own gateway.web.allowedOrigins (workflows/internal/automation/activities/helm.go, cmd/automation/main.go's own WEB_ORIGIN check), without which every browser's WebSocket upgrade to that tenant's gateway is silently rejected." }}
{{- end }}
{{- if not .Values.router.publicURL }}
{{- fail "router.publicURL is required when automation.enabled=true — every tenant this worker provisions gets it written into its own mcp-hub.oauth.mcpHubBaseUrl (workflows/internal/automation/activities/helm.go, cmd/automation/main.go's own ROUTER_PUBLIC_URL check), without which that tenant's OAuth backends (e.g. Notion) complete consent against the wrong mcp-hub instance entirely." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "automation") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "automation") | nindent 4 }}
spec:
  # Deliberately 1, not configurable up like other components here — two
  # replicas would double-poll the same "system" task queue, which Temporal
  # itself handles fine (activities are still dispatched to exactly one
  # worker), but there is no throughput reason to run more than one for a
  # feature whose whole premise is "tenant onboarding is a slow, deliberate
  # event" (docs/components/multi-tenancy.md), and it keeps this worker's
  # unusually broad RBAC (automation-rbac.yaml) running in the fewest
  # possible places.
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "automation") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "automation") | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
      {{- end }}
    spec:
      # The one workload in this chart that DOES need real Kubernetes API
      # access — automation-rbac.yaml's own comment has the full reasoning.
      serviceAccountName: {{ include "agent-harness.componentFullname" (dict "context" . "component" "automation") }}
      automountServiceAccountToken: true
      containers:
        - name: automation
          image: "{{ .Values.automation.image.repository }}:{{ .Values.automation.image.tag }}"
          imagePullPolicy: {{ .Values.automation.image.pullPolicy }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          {{- end }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            # This worker's OWN namespace/queue — where TenantOnboardingWorkflow
            # itself runs. Deliberately separate from TENANT_TEMPORAL_NAMESPACE
            # below; this worker never dials that namespace itself.
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.automation.temporalNamespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.automation.taskQueue | quote }}
            # The shared namespace written into every generated tenant's own
            # temporal.namespace/agent-brain.temporal.namespace — must match
            # temporal.namespace above (the shared loop-worker pool's own),
            # NOT this worker's own TEMPORAL_NAMESPACE above.
            - name: TENANT_TEMPORAL_NAMESPACE
              value: {{ .Values.automation.tenantTemporalNamespace | quote }}
            - name: TENANT_CHART_DIR
              value: {{ .Values.automation.tenantChartDir | quote }}
            # This chart's own release namespace — always knowable from
            # .Release, never a value someone has to remember to set to
            # match how this same chart was actually installed. Still needed:
            # StageTenantSecrets/CleanupStagedSecret stage the submitted
            # tenant secret here (an unrelated concern from the removed
            # shared-pool registration step).
            - name: SHARED_RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TENANT_GATEWAY_PORT
              value: {{ .Values.automation.tenantGatewayPort | quote }}
            - name: TENANT_AGENT_BRAIN_PORT
              value: {{ .Values.automation.tenantAgentBrainPort | quote }}
            # Same single shared Clerk project every tenant's own Gateway
            # verifies against (router-deployment.yaml's identical value) —
            # written into every generated tenant's gateway.web.clerkIssuer.
            {{- if .Values.router.clerkJwksUrl }}
            - name: CLERK_JWKS_URL
              value: {{ .Values.router.clerkJwksUrl | quote }}
            {{- end }}
            {{- if .Values.router.clerkIssuer }}
            - name: CLERK_ISSUER
              value: {{ .Values.router.clerkIssuer | quote }}
            {{- end }}
            # Same origin list router-deployment.yaml's own ROUTER_ALLOWED_ORIGINS
            # (CORS) uses — written into every generated tenant's
            # gateway.web.allowedOrigins (GATEWAY_WEB_ALLOWED_ORIGINS).
            - name: WEB_ORIGIN
              value: {{ join "," .Values.router.allowedOrigins | quote }}
            # Same value as web-deployment.yaml's own ROUTER_PUBLIC_URL —
            # written into every generated tenant's mcp-hub.oauth.mcpHubBaseUrl
            # (see helm.go's buildTenantValues doc comment for why this can't
            # be left at the mcp-hub chart's own default).
            - name: ROUTER_PUBLIC_URL
              value: {{ .Values.router.publicURL | quote }}
          resources:
            {{- toYaml .Values.automation.resources | nindent 12 }}
      {{- with .Values.automation.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.automation.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.automation.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
