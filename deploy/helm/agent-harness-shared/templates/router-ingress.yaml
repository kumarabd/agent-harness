{{- if and .Values.router.enabled .Values.router.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "router") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "router") | nindent 4 }}
  {{- with .Values.router.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.router.ingress.className }}
  ingressClassName: {{ .Values.router.ingress.className }}
  {{- end }}
  {{- if .Values.router.ingress.tls }}
  tls:
    {{- range .Values.router.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.router.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "agent-harness.componentFullname" (dict "context" $ "component" "router") }}
                port:
                  number: {{ $.Values.router.port }}
          {{- end }}
    {{- end }}
{{- end }}
