apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness-shared.fullname" . }}
  labels:
    {{- include "agent-harness-shared.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-harness-shared.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness-shared.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-harness-shared.fullname" . }}
      # This worker never calls the Kubernetes API — it only polls Temporal.
      automountServiceAccountToken: false
      containers:
        - name: loop-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-harness-shared.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
