{{- if not .Values.temporal.address -}}
{{- fail "temporal.address is required — this chart deploys the shared loop-worker pool only, not Temporal itself. Set --set temporal.address=<host>:<port> or the equivalent in your values file." -}}
{{- end -}}
{{- if not .Values.temporal.namespace -}}
{{- fail "temporal.namespace is required. It must already exist in Temporal (temporal operator namespace create <name>)." -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-harness.fullname" . }}-config
  labels:
    {{- include "agent-harness.labels" . | nindent 4 }}
data:
  TEMPORAL_ADDRESS: {{ .Values.temporal.address | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  METRICS_BIND_ADDRESS: {{ printf "0.0.0.0:%d" (int .Values.metrics.port) | quote }}
