# -- This chart is deployed ONCE for the whole cluster
# (docs/components/multi-tenancy.md's "Resolved: Compute Isolation" — the
# shared, tenant-agnostic loop-worker pool): unlike
# deploy/helm/agent-harness-tenant, it is NOT one release per tenant. It
# deploys only the Session Coordinator + Turn Workflow pool, against an
# EXISTING Temporal server/cluster. It deploys none of the per-tenant
# components (activity workers, Postgres, tenant PV) — those come from
# agent-harness-tenant, one release per tenant.
#
# 2026-09-26 — Resolved: Shared Temporal Namespace, Per-Tenant Task Queues
# (docs/components/multi-tenancy.md). Onboarding a new tenant no longer
# touches this release at all: every tenant now shares temporal.namespace
# below with this pool (previously each tenant needed its own namespace,
# statically listed here, requiring a `helm upgrade` — and thus a rollout —
# of this whole shared release on every onboarding). This works because the
# workflow code itself (Session Coordinator, Turn Workflow) is genuinely
# tenant-agnostic orchestration — it never holds a tenant's credentials, and
# routes every activity dispatch to that activity's own tenant-specific
# queue explicitly (workflow.TenantActivityQueue), not by which namespace
# this pool happened to be polling. So this one pool, on one fixed queue,
# safely runs any tenant's workflow instance.

temporal:
  # -- Temporal frontend address, host:port. REQUIRED — the chart will not
  # render a usable deployment without this set (see NOTES.txt).
  # Examples: "temporal-frontend.temporal.svc.cluster.local:7233",
  # "my-namespace.a1b2c.tmprl.cloud:7233"
  address: "temporal-frontend.core.svc.cluster.local:7233"
  # -- The ONE Temporal namespace this pool serves — shared by every tenant
  # now, not a list anymore. NOT the automation worker's own namespace
  # (that stays "system", its own separate control-plane namespace,
  # automation.temporalNamespace below) — "agents" here is named to match
  # the Kubernetes namespace this release (and every tenant) already lives
  # in, a deliberate cosmetic consistency choice between two otherwise
  # unrelated concepts. Must already exist in Temporal (`temporal operator
  # namespace create <name>`) before this chart is installed. Must match
  # every tenant's own agent-harness-tenant release's temporal.namespace
  # exactly.
  namespace: "agents"
  # -- The shared workflow-task queue every tenant's own Gateway starts
  # CoordinatorWorkflow/TurnWorkflow on, and Python starts IntentionWorkflow
  # on — fixed, never tenant-specific (that's a separate concern, each
  # tenant's own TEMPORAL_TASK_QUEUE in agent-harness-tenant). Must match
  # every tenant's own TEMPORAL_WORKFLOW_TASK_QUEUE exactly.
  taskQueue: "agent-loop"

image:
  repository: "gcr.io/kumarabd/agent-harness/loop-worker"
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1
# -- Left empty deliberately: no real usage data exists yet to size these
# from (matching the numeric-values-left-open discipline used throughout
# docs/). Set explicitly before any real deployment.
resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- docs/components/budget-guardrails.md, "Resolved: Metrics Export". Flat/
# top-level (not nested under a loopWorker key) — kept exactly as it was
# before agentWeb/router/automation below were added, so this release's
# already-deployed loop-worker resources are untouched by this change.
metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# -- agent-web (chat UI + agent-brain memory explorer), moved here from
# agent-harness-tenant 2026-09-24 (docs/components/gateway/web.md) — one
# shared deployment for the whole cluster now, fronted by `router` below
# instead of pointing directly at one tenant's own agent-brain/Gateway.
# Uses the PUBLISHED agent-web image (ghcr.io/realnighthawk/agent-web) —
# this repo doesn't build or own that image.
agentWeb:
  enabled: true
  image:
    repository: "ghcr.io/realnighthawk/agent-web"
    tag: "internal"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- The shared, identity-routing front door for agent-web
# (docs/components/gateway/web.md). Verifies the caller's Clerk session JWT,
# resolves their tenant by pure convention (2026-09-25: a sanitized form of
# their own Clerk user id — no database, no registration step, nothing to
# redeploy this chart for), and reverse-proxies to that tenant's own
# per-namespace Gateway/agent-brain/mcp-hub. Holds no tenant credential
# itself, and no database of any kind.
router:
  enabled: true
  image:
    repository: "gcr.io/kumarabd/agent-harness/router"
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Same "reuse agent-web's existing Clerk integration" resolution as
  # agent-harness-tenant's gateway.web.clerkJwksUrl/clerkIssuer (that
  # chart's own comment has the full reasoning) — REQUIRED, one of the two.
  # As of the single-shared-Clerk-project migration (docs/components/
  # gateway/web.md), this is the ONE issuer every tenant's own Gateway/
  # agent-brain now verify against too, not a separate value per tenant.
  clerkJwksUrl: "https://clerk.nighthawklabs.org/.well-known/jwks.json"
  clerkIssuer: "https://clerk.nighthawklabs.org"
  # -- REQUIRED when agentWeb.enabled=true (web-deployment.yaml's own `fail`
  # guard) — 2026-09-24: the router's real public URL (e.g.
  # "https://api.example.com"), not its in-cluster Service name. Consumed by
  # agent-web as ROUTER_PUBLIC_URL — the browser now calls this router
  # directly instead of going through agent-web's own nginx as a same-origin
  # proxy (docs/components/gateway/web.md's "Resolved: Shared agent-web +
  # Identity-Routing Router"), so it needs a real, publicly-reachable
  # address. Requires router.ingress (below) enabled and pointed at this
  # same host, or some other externally-managed ingress doing the same job.
  publicURL: "https://harness-router.nighthawklabs.org"
  # -- CORS — REQUIRED (in practice) alongside publicURL above: the browser
  # request from agent-web's own public origin is genuinely cross-origin
  # now, so this router must explicitly allow it (router/internal/
  # core/cors.go). Set to agent-web's own public origin (scheme+host, no
  # path, e.g. "https://app.example.com") — or "*" to allow any origin, not
  # recommended once this handles real tenant traffic. Comma-separated if
  # more than one. An entry may be a subdomain wildcard, "https://*.example.org"
  # (any subdomain of example.org on https, at any depth; not the bare apex, not
  # another scheme or a port). The router's CORS check honours it; the gateway's
  # WebSocket origin check, which gets this same list, only does exact matches and
  # ignores a wildcard entry.
  allowedOrigins: ["https://mission-control.nighthawklabs.org", "https://*.nighthawklabs.org"]
  # -- Exposes this router outside the cluster — the browser calls it
  # directly now (see publicURL's own comment), so unlike loop-worker or
  # tenant-worker this can't stay purely internal-cluster-DNS once
  # agentWeb.enabled=true. Same shape as the one other Ingress precedent
  # that exists anywhere in either repo (agent-web's OWN
  # charts/agent-web/templates/ingress.yaml) — mirrored deliberately rather
  # than inventing a new convention.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# -- Self-serve tenant onboarding (docs/components/gateway/web.md's Phase
# 2, automation) — TenantOnboardingWorkflow, run on this
# worker's own "system" Temporal namespace/task queue.
automation:
  enabled: true
  image:
    repository: "gcr.io/kumarabd/agent-harness/tenant-automation"
    tag: "latest"
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- This worker's OWN dedicated Temporal namespace/task queue — where
  # TenantOnboardingWorkflow itself actually runs. Deliberately separate
  # from tenantTemporalNamespace below (this worker never dials that
  # namespace itself, only writes its name into a new tenant's own
  # generated values).
  temporalNamespace: "system"
  taskQueue: "system"
  # -- The shared namespace every tenant's own turn-processing uses (must
  # match temporal.namespace above exactly) — written into every generated
  # tenant's own temporal.namespace/agent-brain.temporal.namespace
  # (docs/components/multi-tenancy.md's "Resolved: Shared Temporal
  # Namespace, Per-Tenant Task Queues"). NOT this worker's own namespace.
  tenantTemporalNamespace: "agents"
  # -- Baked into this worker's own image (deploy/docker/automation.Dockerfile)
  # — the actual chart sources `helm upgrade --install` runs against.
  tenantChartDir: "/charts/agent-harness-tenant"
  # -- Must match agent-harness-tenant/values.yaml's own gateway.port /
  # agent-brain subchart defaults — written into that tenant's real Gateway/
  # agent-brain Services (HealthCheckActivity polls these ports directly;
  # the router computes the exact same ports independently on its own side,
  # router/internal/core/tenant.go). Only need to change these if
  # that chart's own defaults ever do.
  tenantGatewayPort: 8090
  tenantAgentBrainPort: 8080
  # 2026-09-25: no clerkSecretKey here anymore — CreateClerkOrganization
  # was removed along with Clerk Organizations entirely (tenant identity is
  # pure convention now, docs/components/gateway/web.md), so this worker no
  # longer holds any Clerk secret, and no Postgres of any kind either
  # (onboarding progress lives in the workflow's own state, queried live via
  # Temporal, not written to a database).
