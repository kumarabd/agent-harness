apiVersion: v2
name: agent-harness
description: >-
  The shared, tenant-agnostic components for agent-harness, deployed ONCE
  for the whole cluster — NOT one release per tenant, see
  docs/components/multi-tenancy.md's "Resolved: Compute Isolation" decision.
  Deploys the loop-worker pool (Session Coordinator + Turn Workflow, Go)
  against an existing Temporal server (does not bundle Temporal or its
  datastore), plus, as of 2026-09-24, the shared agent-web deployment, the
  identity-routing router in front of it, and (2026-09-25) the self-serve
  tenant-onboarding automation worker (docs/components/gateway/web.md) —
  agent-web used to be one instance per tenant in agent-harness-tenant; it's
  shared now, and a caller's tenant is resolved by pure convention (a
  sanitized form of their own Clerk user id — no database, no Clerk
  Organizations, no registration step). This chart has NO Postgres
  dependency of its own: nothing left in it needs one, after tenant identity
  moved to pure convention and onboarding progress moved to a Temporal Query
  (workflow/onboarding.go), and mcp-hub OAuth connection state moved to each
  tenant's own Postgres (agent-harness-tenant, where its real per-tenant
  credentials belong). Deploys none of the per-tenant components themselves
  (tenant workers, each tenant's own Postgres/Gateway/agent-brain/mcp-hub,
  tenant PV) — those still live in the
  agent-harness-tenant chart, one release per tenant.
type: application
version: 0.1.0
appVersion: "0.1.0"
