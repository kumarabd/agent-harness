{{- if .Values.postgres.enabled -}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-postgres
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
  annotations:
    # Keep the generated password stable across `helm upgrade` runs — without
    # this, Helm re-renders a fresh random password on every upgrade and the
    # Postgres instance (which only reads its password at initdb time) and the
    # Secret drift out of sync.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # lookup returns {} (not nil) on a `helm template`/first install, so this
  # falls through to a fresh random password there; on `helm upgrade` against
  # a real cluster it finds the existing Secret and reuses its password.
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "agent-harness.fullname" .))) }}
  {{- if $existing }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
