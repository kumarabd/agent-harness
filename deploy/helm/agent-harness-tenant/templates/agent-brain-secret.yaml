{{- if and .Values.agentBrain.enabled .Values.agentBrainRetain.apiKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-agent-brain
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
type: Opaque
stringData:
  AGENT_BRAIN_RETAIN_API_KEY: {{ .Values.agentBrainRetain.apiKey | quote }}
{{- end }}
