{{- if or .Values.agentBrain.enabled .Values.mcpHub.enabled (include "agent-harness.mapsEngineEnabled" .) (include "agent-harness.anyDataMcp" .) (include "agent-harness.financeEngineEnabled" .) (include "agent-harness.retroEngineEnabled" .) -}}
{{- if and .Values.agentBrain.enabled (not .Values.agentBrain.postgres.password) }}
{{- fail "agentBrain.postgres.password is required when agentBrain.enabled=true." }}
{{- end }}
{{- if and .Values.mcpHub.enabled (not .Values.mcpHub.postgres.password) }}
{{- fail "mcpHub.postgres.password is required when mcpHub.enabled=true." }}
{{- end }}
# Same shared-server-separate-database pattern as ../../infra/postgres's own
# init-roles-hook.yaml, trimmed to the extra roles this chart needs —
# agent-harness's own role/database comes for free from the Bitnami
# postgresql subchart's auth.username/password/database (below), this Job
# adds agent-brain's and mcp-hub's (docs/components/tool-registry.md,
# "Resolved: Postgres Isolation" — mcphub role/database name matches
# mcp-hub's own existing convention, not invented here).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-harness.resourceName" (dict "context" . "name" "postgres-init-roles") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "postgres-init-roles") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-roles
          image: "{{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          # See postgres-migrate-hook.yaml: pin the pull policy so a `:latest`
          # tag does not force a registry re-pull of the custom image on every
          # install/upgrade.
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "agent-harness.postgresqlName" . }}"
                  key: postgres-password
            {{- if .Values.agentBrain.enabled }}
            - name: AGENTBRAIN_USER_PASSWORD
              value: {{ .Values.agentBrain.postgres.password | quote }}
            {{- end }}
            {{- if .Values.mcpHub.enabled }}
            - name: MCPHUB_USER_PASSWORD
              value: {{ .Values.mcpHub.postgres.password | quote }}
            {{- end }}
            {{- if (include "agent-harness.mapsEngineEnabled" .) }}
            - name: MAPSENGINE_USER_PASSWORD
              value: {{ include "agent-harness.mapsEnginePassword" . | quote }}
            {{- end }}
            {{- if (include "agent-harness.financeEngineEnabled" .) }}
            - name: FINANCEENGINE_USER_PASSWORD
              value: {{ include "agent-harness.financeEnginePassword" . | quote }}
            {{- end }}
            {{- if (include "agent-harness.retroEngineEnabled" .) }}
            - name: RETROENGINE_USER_PASSWORD
              value: {{ include "agent-harness.retroEnginePassword" . | quote }}
            {{- end }}
            {{- range $n := list "health" }}
            {{- if (include "agent-harness.dataMcpEnabled" (dict "context" $ "name" $n)) }}
            - name: {{ upper $n }}_USER_PASSWORD
              value: {{ include "agent-harness.dataMcpPassword" (dict "context" $ "name" $n) | quote }}
            {{- end }}
            {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              HOST={{ include "agent-harness.postgresqlName" . }}.{{ .Release.Namespace }}.svc.cluster.local

              psql -h "$HOST" -U postgres -d postgres -v ON_ERROR_STOP=1 -f - <<SQL
              {{- if .Values.agentBrain.enabled }}
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agentbrain') THEN
                  EXECUTE 'CREATE ROLE agentbrain WITH LOGIN PASSWORD ''$(printf '%s' "$AGENTBRAIN_USER_PASSWORD" | sed "s/'/''/g")''';
                END IF;
              END
              \$\$;
              SELECT 'CREATE DATABASE agentbrain OWNER agentbrain'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agentbrain') \gexec
              \connect agentbrain
              CREATE EXTENSION IF NOT EXISTS vector;
              \connect postgres
              {{- end }}
              {{- if .Values.mcpHub.enabled }}
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mcphub') THEN
                  EXECUTE 'CREATE ROLE mcphub WITH LOGIN PASSWORD ''$(printf '%s' "$MCPHUB_USER_PASSWORD" | sed "s/'/''/g")''';
                END IF;
              END
              \$\$;
              SELECT 'CREATE DATABASE mcphub OWNER mcphub'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mcphub') \gexec
              \connect mcphub
              CREATE EXTENSION IF NOT EXISTS vector;
              \connect postgres
              {{- end }}
              {{- if (include "agent-harness.mapsEngineEnabled" .) }}
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mapsengine') THEN
                  EXECUTE 'CREATE ROLE mapsengine WITH LOGIN PASSWORD ''$(printf '%s' "$MAPSENGINE_USER_PASSWORD" | sed "s/'/''/g")''';
                END IF;
              END
              \$\$;
              SELECT 'CREATE DATABASE mapsengine OWNER mapsengine'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mapsengine') \gexec
              \connect mapsengine
              CREATE EXTENSION IF NOT EXISTS timescaledb;
              \connect postgres
              {{- end }}
              {{- if (include "agent-harness.financeEngineEnabled" .) }}
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'financeengine') THEN
                  EXECUTE 'CREATE ROLE financeengine WITH LOGIN PASSWORD ''$(printf '%s' "$FINANCEENGINE_USER_PASSWORD" | sed "s/'/''/g")''';
                END IF;
              END
              \$\$;
              SELECT 'CREATE DATABASE financeengine OWNER financeengine'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'financeengine') \gexec
              \connect financeengine
              CREATE EXTENSION IF NOT EXISTS timescaledb;
              CREATE EXTENSION IF NOT EXISTS vector;
              \connect postgres
              {{- end }}
              {{- if (include "agent-harness.retroEngineEnabled" .) }}
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'retroengine') THEN
                  EXECUTE 'CREATE ROLE retroengine WITH LOGIN PASSWORD ''$(printf '%s' "$RETROENGINE_USER_PASSWORD" | sed "s/'/''/g")''';
                END IF;
              END
              \$\$;
              SELECT 'CREATE DATABASE retroengine OWNER retroengine'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'retroengine') \gexec
              {{- end }}
              {{- range $n := list "health" }}
              {{- if (include "agent-harness.dataMcpEnabled" (dict "context" $ "name" $n)) }}
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $n }}') THEN
                  EXECUTE 'CREATE ROLE {{ $n }} WITH LOGIN PASSWORD ''$(printf '%s' "${{ upper $n }}_USER_PASSWORD" | sed "s/'/''/g")''';
                END IF;
              END
              \$\$;
              SELECT 'CREATE DATABASE {{ $n }} OWNER {{ $n }}'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ $n }}') \gexec
              {{- end }}
              {{- end }}
              SQL
{{- end }}
