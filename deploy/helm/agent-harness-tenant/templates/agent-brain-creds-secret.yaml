{{- if .Values.agentBrain.enabled -}}
{{- if not .Values.agentBrain.postgres.password }}
{{- fail "agentBrain.postgres.password is required when agentBrain.enabled=true." }}
{{- end }}
{{- if not .Values.agentBrain.apiKey }}
{{- fail "agentBrain.apiKey is required when agentBrain.enabled=true." }}
{{- end }}
{{- $agentBrainSub := index .Values "agent-brain" }}
{{- if not $agentBrainSub.secret.jwtSecret }}
{{- fail "agent-brain.secret.jwtSecret is required when agentBrain.enabled=true." }}
{{- end }}
# Single source of truth for EVERY key agent-brain's own env template
# (charts/agent-brain/templates/_helpers.tpl's agent-brain.env) reads from
# agent-brain.secretName — since agent-brain.secret.create=false +
# agent-brain.existingSecret (values.yaml) point that name at THIS Secret
# instead of the subchart generating its own, this has to carry every key
# that chart's env vars reference (postgres-dsn, redis-addr, litellm-api-key,
# jwt-secret, api-keys, and admin-secret IF set — that one's env var is only
# emitted at all when agent-brain.secret.adminSecret is truthy, see below),
# not just the ones this chart computes itself.
# postgres-dsn/api-keys are computed here from agentBrain.postgres.password /
# agentBrain.apiKey (this chart's own values, already used by
# postgres-init-roles-hook.yaml and agent-brain-secret.yaml respectively) so
# those never need a second hand-composed copy. litellm-api-key/jwt-secret
# are genuinely independent secrets with no single source to derive from —
# passed through as-is from agent-brain.secret.litellmAPIKey/jwtSecret
# (values.yaml), read here via `index` since a parent-chart template can't
# dot into a hyphenated key ("agent-brain").
#
# A fixed name is safe (not per-release) — each tenant already gets its own
# Kubernetes namespace.
#
# Must run BEFORE agent-brain's own pre-install/post-install hooks —
# specifically its migrate job (charts/agent-brain/templates/job-migrate.yaml,
# weight 1), which reads this Secret's postgres-dsn key.
apiVersion: v1
kind: Secret
metadata:
  name: agent-brain-creds
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # {release-name}-postgresql, NOT nested through this chart's own fullname —
  # see templates/tenant-worker-deployment.yaml's POSTGRES_HOST comment.
  postgres-dsn: "postgres://agentbrain:{{ .Values.agentBrain.postgres.password }}@{{ .Release.Name }}-postgresql:5432/agentbrain?sslmode=disable"
  # agent-brain's env template reads this key unconditionally regardless of
  # whether Redis is actually used — left empty since this deployment has none.
  redis-addr: ""
  litellm-api-key: {{ $agentBrainSub.secret.litellmAPIKey | quote }}
  # Reuses llm.openai.apiKey (this tenant's real Crusoe credential, already
  # required when llm.enabled — tenant-worker's own ModelCall uses the exact
  # same key) rather than a second hand-copied literal — see values.yaml's
  # agent-brain.mining.llm comment. Empty when llm.enabled=false, matching
  # this key's `optional: true` secretKeyRef in agent-brain's env template.
  mining-llm-api-key: {{ .Values.llm.openai.apiKey | quote }}
  jwt-secret: {{ $agentBrainSub.secret.jwtSecret | quote }}
  # Bootstrap format "key:user-id" — matches tenant-worker's own
  # AGENT_BRAIN_API_KEY (agent-brain-secret.yaml, templates/tenant-worker-deployment.yaml).
  # user-id half is agentBrain.ownerUserID (values.yaml) — see its own
  # comment there for why this needs to match the real Clerk user_id, not
  # stay at the "tenant-worker" placeholder, for a tenant whose explorer UI
  # should see tenant-worker's own memory writes.
  api-keys: "{{ .Values.agentBrain.apiKey }}:{{ .Values.agentBrain.ownerUserID }}"
  {{- if $agentBrainSub.secret.adminSecret }}
  admin-secret: {{ $agentBrainSub.secret.adminSecret | quote }}
  {{- end }}
{{- end }}
