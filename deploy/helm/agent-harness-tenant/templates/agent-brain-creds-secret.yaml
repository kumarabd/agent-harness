{{- if .Values.agentBrain.enabled -}}
{{- if not .Values.agentBrain.postgres.password }}
{{- fail "agentBrain.postgres.password is required when agentBrain.enabled=true." }}
{{- end }}
{{- if not .Values.agentBrain.apiKey }}
{{- fail "agentBrain.apiKey is required when agentBrain.enabled=true." }}
{{- end }}
{{- $agentBrainSub := index .Values "agent-brain" }}
{{- if not $agentBrainSub.secret.jwtSecret }}
{{- fail "agent-brain.secret.jwtSecret is required when agentBrain.enabled=true." }}
{{- end }}
# Single source of truth for EVERY key agent-brain's own env template
# (charts/agent-brain/templates/_helpers.tpl's agent-brain.env) reads from
# agent-brain.secretName — since agent-brain.secret.create=false +
# agent-brain.existingSecret (values.yaml) point that name at THIS Secret
# instead of the subchart generating its own, this has to carry every key
# that chart's env vars reference (postgres-dsn, litellm-api-key,
# jwt-secret, api-keys, and admin-secret IF set — that one's env var is only
# emitted at all when agent-brain.secret.adminSecret is truthy, see below),
# not just the ones this chart computes itself.
# postgres-dsn/api-keys are computed here from agentBrain.postgres.password /
# agentBrain.apiKey (this chart's own values, already used by
# postgres-init-roles-hook.yaml and agent-brain-secret.yaml respectively) so
# those never need a second hand-composed copy. litellm-api-key/jwt-secret
# are genuinely independent secrets with no single source to derive from —
# passed through as-is from agent-brain.secret.litellmAPIKey/jwtSecret
# (values.yaml), read here via `index` since a parent-chart template can't
# dot into a hyphenated key ("agent-brain").
#
# A fixed name is safe (not per-release) — each tenant already gets its own
# Kubernetes namespace.
#
# Must run BEFORE agent-brain's own pre-install/post-install hooks —
# specifically its migrate job (charts/agent-brain/templates/job-migrate.yaml,
# weight 1), which reads this Secret's postgres-dsn key.
apiVersion: v1
kind: Secret
metadata:
  name: agent-brain-creds
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # {release-name}-postgresql, NOT nested through this chart's own fullname —
  # see templates/tenant-worker-deployment.yaml's POSTGRES_HOST comment.
  postgres-dsn: "postgres://agentbrain:{{ .Values.agentBrain.postgres.password }}@{{ .Release.Name }}-postgresql:5432/agentbrain?sslmode=disable"
  litellm-api-key: {{ $agentBrainSub.secret.litellmAPIKey | quote }}
  # Real bug, found live (2026-09-14): this key used to be named
  # `mining-llm-api-key`, a leftover from the old decommissioned mining
  # pipeline's own (differently-wired) credential. agent-brain's chart env
  # template (agent-brain.temporalWorkerEnv, charts/agent-brain/templates/
  # _helpers.tpl) reads secret key literally `llm-api-key` for its LLM_API_KEY
  # env var — consumed today by BOTH worker-temporal's RetainWorkflow extraction
  # and the retain-mcp Deployment's memory_retain/memory_reflect chat-completion
  # calls, neither of which existed when `mining-llm-api-key` was named. The
  # stale name meant this Secret never actually carried a `llm-api-key` key at
  # all — LLM_API_KEY's `optional: true` secretKeyRef silently left it unset on
  # both pods, so every real chat-completion call went out with no
  # Authorization header at all and got a live 401 from the provider. Renamed
  # to match what's actually read; value unchanged (still sourced from the
  # MEDIUM tier's apiKey — agent-brain's own values.yaml: "mining[/retain] is
  # treated as a medium-tier consumer," same reasoning compress_context/
  # exploration_summary already use medium for). Empty when llm.enabled=false
  # or medium isn't configured; matches `optional: true` so agent-brain's own
  # extraction/reflect simply won't run rather than failing the whole pod.
  llm-api-key: {{ .Values.llm.tiers.medium.apiKey | quote }}
  jwt-secret: {{ $agentBrainSub.secret.jwtSecret | quote }}
  # Bootstrap format "key:user-id" — the Go server's own IAM-seeded credential for
  # whoever calls it directly (ops tooling, agent-web's Explorer UI). NOT
  # tenant-worker's own credential anymore (2026-09-13: tenant-worker's connection to
  # this server was removed outright, not merely left unused — see
  # docs/components/memory-slot.md's Notes Log). user-id half is
  # agentBrain.ownerUserID (values.yaml) — see its own comment there for why this
  # needs to match the real Clerk user_id, not stay at the "tenant-worker"
  # placeholder, for a tenant whose explorer UI should see this key's own writes.
  api-keys: "{{ .Values.agentBrain.apiKey }}:{{ .Values.agentBrain.ownerUserID }}"
  {{- if $agentBrainSub.secret.adminSecret }}
  admin-secret: {{ $agentBrainSub.secret.adminSecret | quote }}
  {{- end }}
  {{- if .Values.agentBrainRetain.apiKey }}
  # Consumed by the retain-mcp Deployment's own RETAIN_MCP_API_KEY
  # (charts/agent-brain/templates/deployment-retain-mcp.yaml) — same value as
  # tenant-worker's own AGENT_BRAIN_RETAIN_API_KEY (agent-brain-secret.yaml), one
  # value both sides. Omitted entirely (not emitted as an empty string) when unset,
  # matching RETAIN_MCP_API_KEY's own `optional: true` secretKeyRef — retain-mcp
  # runs with no auth check at all in that case, not "reject everything".
  retain-mcp-api-key: {{ .Values.agentBrainRetain.apiKey | quote }}
  {{- end }}
{{- end }}
