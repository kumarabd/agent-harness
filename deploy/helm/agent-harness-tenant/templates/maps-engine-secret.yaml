{{- if (include "agent-harness.mapsEngineEnabled" .) -}}
{{- if not .Values.mapsEngine.googleMapsApiKey }}
{{- fail "mapsEngine.googleMapsApiKey is required when mapsEngine.enabled=true — maps-engine refuses to start without it." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.resourceName" (dict "context" . "name" "maps-engine") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "maps-engine") | nindent 4 }}
type: Opaque
stringData:
  # Role/database "mapsengine" is created by postgres-init-roles-hook.yaml on this tenant's own Postgres.
  DATABASE_URL: {{ printf "postgres://mapsengine:%s@%s:5432/mapsengine?sslmode=disable" (include "agent-harness.mapsEnginePassword" . | urlquery) (include "agent-harness.postgresqlName" .) | quote }}
  GOOGLE_MAPS_API_KEY: {{ .Values.mapsEngine.googleMapsApiKey | quote }}
  {{- if .Values.mapsEngine.ocmApiKey }}
  OCM_API_KEY: {{ .Values.mapsEngine.ocmApiKey | quote }}
  {{- end }}
{{- end }}
