{{- if (include "agent-harness.retroEngineEnabled" .) -}}
{{- $policy := ((.Values.financeEngine | default dict).networkPolicy | default dict) -}}
# Authentication belongs to the shared router. The engine serves one wardrobe per database.
# Only the router and this tenant's trusted MCP hub may connect. Requires NetworkPolicy enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "retro-engine") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "retro-engine") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "retro-engine") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # One list item holding both selectors means "router pods, in those namespaces" (AND, not OR).
        - namespaceSelector:
            {{- if $policy.routerNamespace }}
            matchLabels:
              kubernetes.io/metadata.name: {{ $policy.routerNamespace | quote }}
            {{- else }} {}
            {{- end }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-harness
              app.kubernetes.io/component: router
      ports:
        - port: {{ .Values.retroEngine.port }}
          protocol: TCP
    {{- if .Values.mcpHub.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "agent-harness.mcpHubName" . | quote }}
      ports:
        - port: {{ .Values.retroEngine.port }}
          protocol: TCP
    {{- end }}
{{- end }}
