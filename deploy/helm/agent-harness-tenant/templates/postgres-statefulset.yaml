{{- if .Values.postgres.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "postgres") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  # Fixed at 1, deliberately not a values.yaml knob: this is one Postgres
  # instance per tenant, owning its data directory exclusively
  # (docs/components/multi-tenancy.md, docs/components/session-filesystem.md).
  # A second replica pointed at the same PGDATA would either refuse to start
  # (Postgres's own exclusive-lock behavior) or corrupt the data directory if
  # that lock were ever bypassed — this is not a scaling dimension.
  replicas: 1
  serviceName: {{ include "agent-harness.componentFullname" (dict "context" . "component" "postgres") }}
  selector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent-harness.fullname" . }}
      automountServiceAccountToken: false
      # The shared tenant PVC (docs/components/session-filesystem.md) starts
      # root-owned. The official postgres image runs as uid/gid 999 and
      # refuses to start against a data directory it doesn't own — this
      # init container fixes ownership of just the postgres subpath before
      # the main container starts, once, idempotently.
      initContainers:
        - name: fix-postgres-data-ownership
          image: "busybox:1.36"
          # Kubernetes auto-creates the subPath directory on the underlying
          # volume if it doesn't exist yet, owned by root — this just fixes
          # ownership to match the postgres image's uid/gid before it starts.
          command: ["sh", "-c", "chown -R 999:999 /pgdata"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            # subPath here, and on the main container below, is what actually
            # confines Postgres to its own slice of the shared PV — without
            # it, the postgres container would have filesystem access to
            # /data/sessions/ too, not just its own subpath
            # (docs/components/session-filesystem.md's disjoint-subpath design).
            - name: tenant-data
              mountPath: /pgdata
              subPath: {{ .Values.tenantVolume.postgresSubPath }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres" (include "agent-harness.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretPasswordKey }}
            # PGDATA is a subdirectory of the mount, not the mount root — the
            # official image's own doc recommends this specifically because
            # the mount root itself may carry filesystem metadata (e.g. a
            # lost+found dir on some volume types) that trips initdb's
            # "data directory is not empty" check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            # subPath confines this container to its own slice of the shared
            # tenant PV — see the same note on the init container above.
            - name: tenant-data
              mountPath: /var/lib/postgresql/data
              subPath: {{ .Values.tenantVolume.postgresSubPath }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: tenant-data
          persistentVolumeClaim:
            claimName: {{ include "agent-harness.fullname" . }}-data
{{- end }}
