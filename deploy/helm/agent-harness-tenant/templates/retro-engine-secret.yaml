{{- if (include "agent-harness.retroEngineEnabled" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.resourceName" (dict "context" . "name" "retro-engine") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "retro-engine") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://retroengine:%s@%s:5432/retroengine?sslmode=disable" (include "agent-harness.retroEnginePassword" . | urlquery) (include "agent-harness.postgresqlName" .) | quote }}
  MINIO_ACCESS_KEY: retro-engine
  MINIO_SECRET_KEY: {{ include "agent-harness.minioPassword" (dict "context" . "purpose" "retro-minio") | quote }}
{{- end }}
