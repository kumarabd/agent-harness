{{- if (include "agent-harness.financeEngineEnabled" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.resourceName" (dict "context" . "name" "finance-engine") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "finance-engine") | nindent 4 }}
type: Opaque
stringData:
  # Role/database "financeengine" is created by postgres-init-roles-hook.yaml on this tenant's own Postgres.
  # Existing finance-mcp data remains in the old "finance" database until it is migrated explicitly.
  DATABASE_URL: {{ printf "postgres://financeengine:%s@%s:5432/financeengine?sslmode=disable" (include "agent-harness.financeEnginePassword" . | urlquery) (include "agent-harness.postgresqlName" .) | quote }}
{{- end }}
