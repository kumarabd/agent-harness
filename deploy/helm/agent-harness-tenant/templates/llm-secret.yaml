{{- if .Values.llm.enabled -}}
{{- if not .Values.llm.openai.apiKey }}
{{- fail "llm.openai.apiKey is required when llm.enabled=true." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-llm
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "activity-worker") | nindent 4 }}
type: Opaque
stringData:
  PIONEER_API_KEY: {{ .Values.llm.openai.apiKey | quote }}
{{- end }}
