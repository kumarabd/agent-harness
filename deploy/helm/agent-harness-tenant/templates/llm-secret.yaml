{{- if .Values.llm.enabled -}}
{{- /* One Secret key per configured tier — apiKey lives on the tier itself (2026-08-28, per-tier provider revision), so different tiers with different providers get different keys. tenant-worker-deployment.yaml pulls each via secretKeyRef by LANGUAGE_<TIER>_API_KEY key name. Tiers with no model set are skipped entirely; a tier with a model but no apiKey is rejected at chart-render time by tenant-worker-deployment.yaml's top-of-file guard. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-llm
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
type: Opaque
stringData:
  {{- range $tier := list "fast" "medium" "expert" }}
  {{- $t := index $.Values.llm.tiers $tier }}
  {{- if $t.model }}
  LANGUAGE_{{ upper $tier }}_API_KEY: {{ $t.apiKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
