{{- if .Values.gateway.enabled -}}
{{- if and (not .Values.gateway.web.clerkJwksUrl) (not .Values.gateway.web.clerkIssuer) }}
{{- fail "gateway.web.clerkJwksUrl or gateway.web.clerkIssuer is required when gateway.enabled=true — the gateway can't verify any session token without one." }}
{{- end }}
{{- if not .Values.gateway.web.allowedOrigins }}
{{- fail "gateway.web.allowedOrigins is required when gateway.enabled=true — agent-web's own public origin, without it every browser's /web/ws WebSocket upgrade is rejected (values.yaml's own comment has the full story)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "gateway") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "gateway") | nindent 8 }}
      annotations:
        {{- if .Values.gateway.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.gateway.metrics.port | quote }}
        prometheus.io/path: {{ .Values.gateway.metrics.path | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agent-harness.resourceName" (dict "context" . "name" "tenant") }}
      # Same reasoning as tenant-worker: this process never calls the
      # Kubernetes API, only Temporal and this tenant's own Postgres.
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
            {{- if .Values.gateway.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.gateway.metrics.port }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-harness.resourceName" (dict "context" . "name" "config") }}
          env:
            - name: GATEWAY_BIND_ADDRESS
              value: {{ printf "0.0.0.0:%d" (int .Values.gateway.port) | quote }}
            # Bitnami postgresql subchart's own generated Service/Secret name,
            # same as tenant-worker-deployment.yaml's identical block — this
            # is the gateway's own Postgres connection for the
            # dedup/session-upsert writes and the direct poll reads
            # (docs/components/gateway/web.md's "delivery collapses" finding),
            # never a shared connection with tenant-worker.
            - name: POSTGRES_HOST
              value: "{{ include "agent-harness.postgresqlName" . }}"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "agent-harness.postgresqlName" . }}"
                  key: password
            # docs/components/gateway/web.md, "Resolved: Auth" — plain,
            # non-secret values (clerk.go: verified against the project's own
            # public JWKS endpoint, no Clerk secret key involved — same
            # mechanism agent-brain's own explorer API already uses for this
            # exact Clerk project). Not a Secret for the same reason
            # agent-brain's own chart renders these as plain env vars too.
            {{- if .Values.gateway.web.clerkJwksUrl }}
            - name: CLERK_JWKS_URL
              value: {{ .Values.gateway.web.clerkJwksUrl | quote }}
            {{- end }}
            {{- if .Values.gateway.web.clerkIssuer }}
            - name: CLERK_ISSUER
              value: {{ .Values.gateway.web.clerkIssuer | quote }}
            {{- end }}
            # webSocketOriginAllowed's env-var fallback (gateway/internal/
            # web/web.go) — see values.yaml's own comment on why the
            # same-host fallback alone can never pass in this architecture.
            - name: GATEWAY_WEB_ALLOWED_ORIGINS
              value: {{ .Values.gateway.web.allowedOrigins | quote }}
            # docs/components/gateway/discord.md, "Resolved: Auth" — real bot
            # token(s), unlike Clerk's issuer/JWKS above: leaking one lets
            # someone impersonate that bot in every server it's in. A
            # Secret, not a plain value (this project already made the
            # opposite mistake once with a Clerk secret key that turned out
            # not to need to be one — not repeating that misjudgment in the
            # other direction here). Optional — Discord is one of possibly
            # several platform kinds this tenant's Gateway runs; only starts
            # any Discord goroutines (discord.go) if this list is non-empty.
            # Comma-separated (main.go's discordBotTokens()) — a tenant can
            # run more than one Discord bot, docs/components/gateway/
            # discord-voice.md's multi-bot resolution.
            {{- if .Values.gateway.discord.bots }}
            - name: DISCORD_BOT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.resourceName" (dict "context" . "name" "gateway-discord") }}
                  key: DISCORD_BOT_TOKENS
            {{- end }}
            # gateway/voice_stt_tts.go's SPEECH_API_KEY —
            # values.yaml's gateway.speechAPIKey's own comment has the real
            # 401 this fixes.
            {{- if .Values.gateway.speechAPIKey }}
            - name: SPEECH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.resourceName" (dict "context" . "name" "gateway-speech") }}
                  key: SPEECH_API_KEY
            {{- end }}
            # gateway/voice_stt_tts.go's TTS_VOICE — not a
            # secret, values.yaml's own comment has the real 500 this fixes.
            {{- if .Values.gateway.ttsVoice }}
            - name: TTS_VOICE
              value: {{ .Values.gateway.ttsVoice | quote }}
            {{- end }}
            # gateway/voice_filler_player.go's FILLER_ENABLED —
            # opt-in filler injection, values.yaml's own comment has the
            # full reasoning. Only ever set to "true" when explicitly
            # enabled — omitted entirely otherwise, matching main.go's own
            # fillerEnabled() reading a plain unset env var as false.
            {{- if .Values.gateway.voiceFillerEnabled }}
            - name: FILLER_ENABLED
              value: "true"
            {{- end }}
            # docs/components/gateway/discord-voice.md's "Resolved: Silero
            # VAD" — localhost, not a Service DNS name: the sidecar below
            # is a second container in this SAME pod, sharing this
            # container's network namespace. A plain gRPC dial target
            # (host:port), not a URL — no scheme — despite the env var's
            # name, carried over from an earlier HTTP prototype.
            {{- if .Values.gateway.vadSidecar.enabled }}
            - name: VAD_SIDECAR_URL
              value: {{ printf "localhost:%d" (int .Values.gateway.vadSidecar.port) | quote }}
            {{- end }}
            # docs/components/gateway/discord-voice.md's "Resolved: Gated
            # Streaming STT Feed" — a real Service DNS name (not localhost),
            # since WhisperLive is a standalone cluster service, not a
            # container in this pod. The gateway feeds it only during
            # utterances, not continuously.
            {{- if .Values.gateway.realtimeStt.enabled }}
            - name: WHISPERLIVE_URL
              value: {{ .Values.gateway.realtimeStt.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
        {{- if .Values.gateway.vadSidecar.enabled }}
        - name: vad-sidecar
          image: "{{ .Values.gateway.vadSidecar.image.repository }}:{{ .Values.gateway.vadSidecar.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.vadSidecar.image.pullPolicy }}
          ports:
            - name: vad
              containerPort: {{ .Values.gateway.vadSidecar.port }}
          env:
            - name: VAD_SIDECAR_BIND
              value: "127.0.0.1"
            - name: VAD_SIDECAR_PORT
              value: {{ .Values.gateway.vadSidecar.port | quote }}
          resources:
            {{- toYaml .Values.gateway.vadSidecar.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
