{{- if and (include "agent-harness.financeEngineEnabled" .) .Values.financeEngine.networkPolicy.enabled -}}
# finance-engine trusts the router's X-Nighthawk-Verified-User header, so it must be reachable from nowhere else.
# Only the shared router's pods may connect. The router is matched by its pod labels (agent-harness-shared's router
# Deployment), in the namespace named by financeEngine.networkPolicy.routerNamespace, or in any namespace when that
# is left empty. Requires a CNI that enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "finance-engine") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "finance-engine") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "finance-engine") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # One list item holding both selectors means "router pods, in those namespaces" (AND, not OR).
        - namespaceSelector:
            {{- if .Values.financeEngine.networkPolicy.routerNamespace }}
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.financeEngine.networkPolicy.routerNamespace | quote }}
            {{- else }} {}
            {{- end }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-harness
              app.kubernetes.io/component: router
      ports:
        - port: {{ .Values.financeEngine.port }}
          protocol: TCP
{{- end }}
