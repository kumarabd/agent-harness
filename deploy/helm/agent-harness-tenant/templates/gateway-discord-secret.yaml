{{- if and .Values.gateway.enabled .Values.gateway.discord.botToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-gateway-discord
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: {{ .Values.gateway.discord.botToken | quote }}
{{- end }}
