{{- if and .Values.gateway.enabled .Values.gateway.discord.bots -}}
{{- $tokens := list -}}
{{- range .Values.gateway.discord.bots -}}
{{- $tokens = append $tokens .botToken -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-gateway-discord
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  # Comma-separated — main.go's discordBotTokens() (workflows/cmd/gateway),
  # same convention loop-worker's own TEMPORAL_NAMESPACES already uses.
  # values.yaml's gateway.discord.bots is a list specifically so a tenant
  # can run more than one Discord bot (docs/components/gateway/discord-voice.md's
  # multi-bot resolution) without a schema change here — this template
  # only ever needs to join whatever's in that list.
  DISCORD_BOT_TOKENS: {{ $tokens | join "," | quote }}
{{- end }}
