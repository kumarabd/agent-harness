{{- if and .Values.gateway.enabled .Values.gateway.speechAPIKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-gateway-speech
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  # workflows/cmd/gateway/voice_stt_tts.go's SPEECH_API_KEY — real, live
  # 401 confirmed on Gateway's own /audio/transcriptions and /audio/speech
  # calls to litellm-service before this existed: nothing ever wired this
  # env var, so speechAPIKey stayed empty and no Authorization header was
  # ever sent at all. A Secret, not a plain value, same treatment as
  # gateway-discord-secret.yaml's bot token(s) — this is litellm's own
  # master/API key, and leaking it lets someone spend this tenant's real
  # LLM/embedding budget, comparable severity to a leaked bot token.
  SPEECH_API_KEY: {{ .Values.gateway.speechAPIKey | quote }}
{{- end }}
