{{- if (include "agent-harness.retroEngineEnabled" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "minio.existingSecret is required" .Values.minio.existingSecret | quote }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "minio") | nindent 4 }}
type: Opaque
stringData:
  rootUser: retro-admin
  rootPassword: {{ include "agent-harness.minioPassword" (dict "context" . "purpose" "minio-root") | quote }}
{{- end }}
