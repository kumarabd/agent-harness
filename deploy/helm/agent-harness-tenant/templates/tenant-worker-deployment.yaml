{{- if .Values.llm.enabled -}}
{{- if not .Values.llm.openai.model }}
{{- fail "llm.openai.model is required when llm.enabled=true — the provider's model catalog isn't known ahead of time, so there's no safe default to guess." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "tenant-worker") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "tenant-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.tenantWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "tenant-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "tenant-worker") | nindent 8 }}
      {{- if or .Values.tenantWorker.metrics.enabled .Values.tenantWorker.podAnnotations }}
      annotations:
        {{- if .Values.tenantWorker.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.tenantWorker.metrics.port | quote }}
        prometheus.io/path: {{ .Values.tenantWorker.metrics.path | quote }}
        {{- end }}
        {{- with .Values.tenantWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-harness.fullname" . }}
      # This worker never calls the Kubernetes API — it only polls Temporal
      # and (per docs/components/multi-tenancy.md) talks to this tenant's own
      # Postgres and mounts this tenant's own session filesystem PV.
      automountServiceAccountToken: false
      containers:
        - name: tenant-worker
          image: "{{ .Values.tenantWorker.image.repository }}:{{ .Values.tenantWorker.image.tag }}"
          imagePullPolicy: {{ .Values.tenantWorker.image.pullPolicy }}
          {{- if .Values.tenantWorker.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.tenantWorker.metrics.port }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-harness.fullname" . }}-config
          {{- if or .Values.postgres.enabled .Values.llm.enabled }}
          env:
          {{- if .Values.postgres.enabled }}
            # {statefulset-name}-0.{headless-service-name} — the stable
            # per-pod DNS name the headless postgres-service.yaml gives pod 0
            # (the only pod, since postgres replicas is fixed at 1). Just the
            # bare service name would also resolve via headless-service DNS
            # round-robin across ready pods, but the explicit -0 form is what
            # actually documents "there is exactly one Postgres pod" rather
            # than relying on that being true only because replicas happens
            # to be 1 today.
            - name: POSTGRES_HOST
              value: "{{ include "agent-harness.componentFullname" (dict "context" . "component" "postgres") }}-0.{{ include "agent-harness.componentFullname" (dict "context" . "component" "postgres") }}"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            # Mounting the same Secret the Postgres instance itself uses,
            # rather than duplicating the password into a second Secret —
            # one credential, one source, shared by both sides.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres" (include "agent-harness.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretPasswordKey }}
          {{- end }}
          {{- if .Values.llm.enabled }}
            # Real ModelCall calls only (activities/activities/llm.py) —
            # turns with a _test_scripted_responses fixture never touch this.
            - name: PIONEER_BASE_URL
              value: {{ .Values.llm.openai.baseURL | quote }}
            - name: PIONEER_MODEL
              value: {{ .Values.llm.openai.model | quote }}
            - name: PIONEER_MAX_TOKENS
              value: {{ .Values.llm.openai.maxTokens | quote }}
            - name: PIONEER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-llm
                  key: PIONEER_API_KEY
          {{- end }}
          {{- end }}
          {{- if .Values.tenantVolume.enabled }}
          volumeMounts:
            # The session filesystem tree (docs/components/session-filesystem.md)
            # lives under a subpath disjoint from Postgres's own subpath on the
            # same tenant PV — this worker only ever sees its own slice.
            - name: tenant-data
              mountPath: /sessions
              subPath: {{ .Values.tenantVolume.sessionsSubPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.tenantWorker.resources | nindent 12 }}
      {{- if .Values.tenantVolume.enabled }}
      volumes:
        - name: tenant-data
          persistentVolumeClaim:
            claimName: {{ include "agent-harness.fullname" . }}-data
      {{- end }}
      {{- with .Values.tenantWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tenantWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tenantWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
