{{- if .Values.llm.enabled -}}
{{- /* docs/components/model-registry.md — no cross-tier fallback, no shared provider default. Require at least one tier to be set (rely on the Python-side error to name any specific unset tier that a call resolves to), and require any tier that IS set to be fully configured (provider + model + apiKey; also baseURL for provider=openai). */ -}}
{{- if and (not .Values.llm.tiers.fast.model) (not .Values.llm.tiers.medium.model) (not .Values.llm.tiers.expert.model) }}
{{- fail "at least one of llm.tiers.{fast,medium,expert}.model must be set when llm.enabled=true — every configured tier owns its own provider identity (2026-08-28), and no cross-tier fallback exists." }}
{{- end }}
{{- $known := list "openai" "anthropic" }}
{{- range $tier := list "fast" "medium" "expert" }}
{{- $t := index $.Values.llm.tiers $tier }}
{{- if $t.model }}
{{- if not $t.provider }}
{{- fail (printf "llm.tiers.%s.provider is required when llm.tiers.%s.model is set — must be one of \"openai\" or \"anthropic\". See docs/components/model-registry.md." $tier $tier) }}
{{- end }}
{{- if not (has $t.provider $known) }}
{{- fail (printf "llm.tiers.%s.provider=%q is not supported — must be one of \"openai\" or \"anthropic\"." $tier $t.provider) }}
{{- end }}
{{- if not $t.apiKey }}
{{- fail (printf "llm.tiers.%s.apiKey is required when llm.tiers.%s.model is set — every configured tier owns its own credential." $tier $tier) }}
{{- end }}
{{- if and (eq $t.provider "openai") (not $t.baseURL) }}
{{- fail (printf "llm.tiers.%s.baseURL is required when llm.tiers.%s.provider=openai — there's no single canonical endpoint. (provider=anthropic accepts an empty baseURL — the SDK has its own default.)" $tier $tier) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness.componentFullname" (dict "context" . "component" "worker") }}
  labels:
    {{- include "agent-harness.componentLabels" (dict "context" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.tenantWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-harness.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 8 }}
      {{- if or .Values.tenantWorker.metrics.enabled .Values.tenantWorker.podAnnotations }}
      annotations:
        {{- if .Values.tenantWorker.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.tenantWorker.metrics.port | quote }}
        prometheus.io/path: {{ .Values.tenantWorker.metrics.path | quote }}
        {{- end }}
        {{- with .Values.tenantWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-harness.fullname" . }}
      # This worker never calls the Kubernetes API — it only polls Temporal
      # and (per docs/components/multi-tenancy.md) talks to this tenant's own
      # Postgres and mounts this tenant's own session filesystem PV.
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: "{{ .Values.tenantWorker.image.repository }}:{{ .Values.tenantWorker.image.tag }}"
          imagePullPolicy: {{ .Values.tenantWorker.image.pullPolicy }}
          {{- if .Values.tenantWorker.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.tenantWorker.metrics.port }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-harness.fullname" . }}-config
          {{- if or .Values.postgresql .Values.llm.enabled .Values.agentBrain.enabled }}
          env:
            # Bitnami postgresql subchart's own generated Service/Secret
            # naming — {release-name}-postgresql, NOT nested through this
            # chart's own fullname helper. Each subchart computes its own
            # fullname independently from .Release.Name + its own Chart.Name
            # (confirmed by rendering, not assumed — see Notes Log).
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-postgresql"
                  key: password
          {{- if .Values.tenantVolume.enabled }}
            # docs/components/user-input.md — PERMISSION_LIST reads this
            # file path, not an env var's own content (see the volumeMount
            # above for why). Fixed path, not a values.yaml knob — nothing
            # tenant-specific about where on its own PV this lives.
            - name: TOOL_PERMISSION_LIST_FILE
              value: "/config/permission_list.json"
          {{- end }}
          {{- if .Values.llm.enabled }}
            # Real ModelCall calls only (activities/activities/llm.py) —
            # turns with a _test_scripted_responses fixture never touch
            # these. Every configured tier owns its own provider triple
            # (model + apiKey + baseURL) and optional tuning knobs
            # (maxTokens, contextWindow, pricing). docs/components/
            # model-registry.md. Rendered per-tier in a loop below;
            # `apiKey` comes from templates/llm-secret.yaml (one secret
            # key per configured tier).
            {{- range $tier := list "fast" "medium" "expert" }}
            {{- $t := index $.Values.llm.tiers $tier }}
            {{- if $t.model }}
            {{- $upper := upper $tier }}
            - name: LANGUAGE_{{ $upper }}_PROVIDER
              value: {{ $t.provider | quote }}
            - name: LANGUAGE_{{ $upper }}_MODEL
              value: {{ $t.model | quote }}
            {{- if $t.baseURL }}
            - name: LANGUAGE_{{ $upper }}_BASE_URL
              value: {{ $t.baseURL | quote }}
            {{- end }}
            - name: LANGUAGE_{{ $upper }}_MAX_TOKENS
              value: {{ $t.maxTokens | default 4096 | quote }}
            - name: LANGUAGE_{{ $upper }}_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" $ }}-llm
                  key: LANGUAGE_{{ $upper }}_API_KEY
            {{- if $t.contextWindow }}
            - name: LANGUAGE_{{ $upper }}_CONTEXT_WINDOW
              value: {{ $t.contextWindow | quote }}
            {{- end }}
            {{- if $t.costPerMillionTokens.input }}
            - name: LANGUAGE_{{ $upper }}_INPUT_COST_PER_MILLION_TOKENS
              value: {{ $t.costPerMillionTokens.input | quote }}
            {{- end }}
            {{- if $t.costPerMillionTokens.output }}
            - name: LANGUAGE_{{ $upper }}_OUTPUT_COST_PER_MILLION_TOKENS
              value: {{ $t.costPerMillionTokens.output | quote }}
            {{- end }}
            {{- if $t.costPerMillionTokens.cachedInput }}
            - name: LANGUAGE_{{ $upper }}_CACHED_INPUT_COST_PER_MILLION_TOKENS
              value: {{ $t.costPerMillionTokens.cachedInput | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.agentBrain.enabled }}
            # components/memory-slot.md — WriteMemory/search/expand calls
            # only; nothing here if a session never touches memory. Computed,
            # not a value — the agent-brain subchart is installed under
            # nameOverride "memory" (values.yaml's agent-brain.nameOverride),
            # so its Service renders as <release>-memory-server
            # (charts/agent-brain/templates/service-server.yaml), deterministic
            # from this release's own name. No /sse or /mcp suffix here —
            # activities/activities/agent_brain.py appends /mcp itself
            # (streamable-HTTP transport, not the classic SSE transport that
            # chart's own TRANSPORT=sse config also serves alongside it at
            # /sse).
            - name: AGENT_BRAIN_BASE_URL
              value: "http://{{ .Release.Name }}-memory-server:8080"
            - name: AGENT_BRAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-agent-brain
                  key: AGENT_BRAIN_API_KEY
            # -- REQUIRED by agent-brain's own auth (internal/mcp/tenant.go's
            # "agent_id required" check, whenever that chart's
            # AUTH_REQUIRED=true) — not a secret, a plain per-install
            # identifier ("the same for every install" per agent-brain's own
            # domain.TenantContext.AgentID comment).
            - name: AGENT_BRAIN_AGENT_ID
              value: {{ .Values.agentBrain.agentID | quote }}
          {{- end }}
          {{- if .Values.mcpHub.enabled }}
            # docs/components/tool-registry.md's mcp-hub-mediated tier — no
            # native/Python dispatch code calls this yet (not built), this
            # only makes the endpoint reachable. Named MCP_HUB_URL, not
            # MCP_HUB_BASE_URL — the mcp-hub Deployment itself already uses
            # that exact name for a different purpose (its own OAuth
            # redirect base URL, oauth.mcpHubBaseUrl), and while they're
            # separate pods so there's no real conflict, reusing the name
            # would be confusing to read later. Computed, not a value —
            # mcp-hub is installed under nameOverride "tools" (values.yaml's
            # mcp-hub.nameOverride), so its Service renders as
            # <release>-tools (charts/mcp-hub/templates/_helpers.tpl's
            # mcp-hub.fullname), deterministic from this release's own name.
            # Port 8000 hardcoded matching that chart's own service.port
            # default, same convention as AGENT_BRAIN_BASE_URL's hardcoded
            # 8080 above — if mcp-hub.service.port is ever overridden
            # per-tenant, update this too.
            - name: MCP_HUB_URL
              value: "http://{{ .Release.Name }}-tools:8000"
            # docs/components/tool-registry.md's "Resolved: Native-Tool
            # Discovery" — shell_hub.py's own embedding provider, reusing
            # mcp-hub's own LiteLLM config rather than a third credential.
            # Read via `index` since a parent-chart template can't dot into
            # a hyphenated key ("mcp-hub"), same reasoning as
            # agent-brain-creds-secret.yaml's $agentBrainSub.
            - name: EMBEDDING_BASE_URL
              value: {{ (index .Values "mcp-hub" "embedding" "baseUrl") | quote }}
            - name: EMBEDDING_MODEL
              value: {{ (index .Values "mcp-hub" "embedding" "model") | quote }}
            - name: EMBEDDING_DIM
              value: {{ (index .Values "mcp-hub" "embedding" "dimensions") | quote }}
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-tools
                  key: EMBEDDING_API_KEY
          {{- end }}
          {{- end }}
          {{- if .Values.tenantVolume.enabled }}
          volumeMounts:
            # The session filesystem tree (docs/components/session-filesystem.md)
            # — Postgres no longer shares this PV at all (its own dedicated
            # Bitnami-managed PVC, see values.yaml's postgresql.* comment).
            - name: tenant-data
              mountPath: /sessions
              subPath: {{ .Values.tenantVolume.sessionsSubPath }}
            # docs/components/user-input.md's PERMISSION_LIST — a plain file
            # on this same tenant PV under its own disjoint subPath, not a
            # Helm value: edited directly at runtime (kubectl exec, or in
            # principle the tenant's own shell_exec), read once at process
            # startup, missing file == empty list. Deliberately not Helm-
            # templated content the way most other config here is — there's
            # nothing tenant-identity-shaped about a mutable policy list, and
            # a Helm value would just be a second, driftable copy of
            # whatever's actually on disk.
            - name: tenant-data
              mountPath: /config
              subPath: {{ .Values.tenantVolume.configSubPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.tenantWorker.resources | nindent 12 }}
      {{- if .Values.tenantVolume.enabled }}
      volumes:
        - name: tenant-data
          persistentVolumeClaim:
            claimName: {{ include "agent-harness.fullname" . }}-data
      {{- end }}
      {{- with .Values.tenantWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tenantWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tenantWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
