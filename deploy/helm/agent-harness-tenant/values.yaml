# -- This chart is one release PER TENANT (docs/components/multi-tenancy.md):
# install it once per tenant, each with its own release name (the tenant's
# slug). It deploys the tenant's worker fleet, its own self-hosted Postgres
# instance + PV, against an EXISTING Temporal server/cluster. It does not
# deploy Temporal itself.
#
# The loop-worker pool (Session Coordinator + Turn Workflow) is NOT deployed
# by this chart at all — the loop worker is tenant-agnostic and runs as a
# separate shared pool, deployed ONCE for the whole cluster via the sibling
# ../agent-harness-shared chart.
#
# 2026-09-26 — Resolved: Shared Temporal Namespace, Per-Tenant Task Queues
# (docs/components/multi-tenancy.md). Every tenant now shares ONE Temporal
# namespace with the shared pool (temporal.namespace below is a fixed,
# cluster-wide constant, not unique per tenant) — onboarding a new tenant no
# longer means creating a namespace or touching the shared release's own
# config at all. Isolation moved entirely to TASK QUEUE naming instead: this
# tenant's own tenant-worker fleet and Gateway poll/dispatch to
# "<release-name>-loop" (computed directly from .Release.Name in
# templates/configmap.yaml — never set here, can't drift), while the shared
# loop-worker pool itself still polls one fixed, non-tenant-specific queue
# ("agent-loop") since its own workflow code is genuinely tenant-agnostic
# orchestration that routes each activity dispatch to the RIGHT tenant's own
# queue explicitly (workflow.TenantActivityQueue, Go side).
temporal:
  # -- Temporal frontend address, host:port. REQUIRED — the chart will not
  # render a usable deployment without this set (see NOTES.txt).
  # Examples: "temporal-frontend.temporal.svc.cluster.local:7233",
  # "my-namespace.a1b2c.tmprl.cloud:7233"
  address: "temporal-frontend.core.svc.cluster.local:7233"
  # -- The ONE Temporal namespace shared by every tenant AND the shared
  # loop-worker pool — NOT unique per tenant anymore (see this block's own
  # comment above), and NOT the automation worker's own separate "system"
  # control-plane namespace either. Named "agents" to match the Kubernetes
  # namespace every tenant already lives in — a deliberate cosmetic
  # consistency choice between two otherwise unrelated concepts. Must match
  # ../agent-harness-shared's own temporal.namespace exactly.
  namespace: "agents"

tenantWorker:
  image:
    repository: "gcr.io/kumarabd/agent-harness/tenant-worker"
    tag: "latest"
    pullPolicy: IfNotPresent
  # -- Multi-replica by default: this is the dedicated-per-tenant fleet that
  # holds tenant credentials and does real content I/O
  # (docs/components/multi-tenancy.md). Requires tenantVolume.accessMode to
  # support multiple simultaneous mounters if > 1 — see that value's comment.
  replicaCount: 1
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- docs/components/budget-guardrails.md, "Resolved: Metrics Export".
  # Nested under tenantWorker (not a top-level key) deliberately — this is
  # this tenant's own worker's exposition endpoint, not shared/global config,
  # consistent with everything else under this key being specific to this
  # release. Tenant identity on scraped metrics comes for free from the
  # existing app.kubernetes.io/instance={{ .Release.Name }} pod label
  # (templates/_helpers.tpl) that standard Prometheus Kubernetes
  # service-discovery already captures — nothing new needed for that here.
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"

# -- The Web platform's inbound/outbound path (docs/components/gateway.md,
# docs/components/gateway/web.md) — gateway. One per tenant,
# same isolation reasoning as tenantWorker above: this process talks
# directly to this tenant's own Postgres, so it is never shared across
# tenants. Disabled by default — a tenant with no Web client configured yet
# has nothing for this to serve.
gateway:
  enabled: false
  image:
    repository: "gcr.io/kumarabd/agent-harness/gateway"
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8090
  # -- docs/components/budget-guardrails.md's "Resolved: Metrics Export"
  # mechanism (Temporal SDK metrics handler -> Prometheus scrape), added to
  # this chart 2026-08-26 specifically so voice-latency metrics
  # (voice_first_audio_latency_seconds, voice_chunk_gap_seconds,
  # voice_tts_ttfb_seconds — docs/components/gateway/discord-voice.md's Notes
  # Log) have somewhere to report to; this process had no metrics exposition
  # at all before that. Same shape as tenantWorker.metrics below — port 9090
  # matches main.go's own METRICS_BIND_ADDRESS default, no explicit env var
  # override needed for the common case, same convention loop-worker/
  # tenant-worker already use.
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  # -- Per-platform config, one block per Gateway platform kind
  # (docs/components/gateway.md's "Resolved: Multi-Session Channels" —
  # Platform is "web"/"discord"/... on MessageEvent). Every block below is
  # independently optional; the single Deployment above starts only the
  # goroutines its own platform block actually configures (main.go). Split
  # out from flat gateway.* keys (gateway.clerkIssuer, gateway.discordBotToken)
  # specifically so adding a third platform later is a new block here, not a
  # renegotiation of what's namespaced under what.
  web:
    # -- One of these two is REQUIRED when gateway.enabled=true —
    # docs/components/gateway/web.md's "Resolved: Auth" (reuse agent-web's
    # existing Clerk project). Neither is secret — the gateway verifies
    # session tokens against the project's own public JWKS endpoint, the same
    # mechanism agent-brain's own explorer API already uses for this exact
    # Clerk project (see charts/agent-brain's own clerkIssuer default, which
    # is likewise committed in plain text) — there is no Clerk secret key
    # anywhere in this deployment. clerkJwksUrl, if set, wins over
    # clerkIssuer (clerk.go's own precedence).
    clerkJwksUrl: ""
    clerkIssuer: ""
    # -- REQUIRED when gateway.enabled=true. The browser app's own public
    # origin (agent-web, e.g. "https://mission-control.nighthawklabs.org") —
    # NOT this tenant's own gateway/router hostname. Wired into
    # GATEWAY_WEB_ALLOWED_ORIGINS (gateway/internal/web/web.go's
    # webSocketOriginAllowed). 2026-09-27: this was never set anywhere in
    # this chart or in buildTenantValues, and /web/ws's own same-host
    # fallback (`u.Host == r.Host`) can never match in this shared-router
    # architecture — the request that reaches this Deployment has already
    # been proxied through harness-router, so r.Host is the router's own
    # public hostname, never agent-web's. With neither check able to pass,
    # EVERY browser's WebSocket upgrade was rejected (a fast, silent
    # rejection the gorilla/websocket upgrader itself sends — the browser
    # only ever sees this as a bare, reason-less code 1006), regardless of
    # how valid the caller's Clerk session was. Same value as
    # deploy/helm/agent-harness-shared/values.yaml's router.allowedOrigins —
    # there is one agent-web deployment for the whole cluster, so this is a
    # platform-wide constant, not really per-tenant.
    allowedOrigins: ""
  discord:
    # -- Optional — docs/components/gateway/discord.md's "Resolved: Auth",
    # docs/components/gateway/discord-voice.md's multi-bot resolution
    # (2026-08-25). A LIST, not a single token: a tenant can run more than
    # one Discord bot (gateway.md's composable connection_id), each an
    # independent entry here. Empty list leaves this tenant on Web only.
    # Each real token, unlike web.clerkIssuer/web.clerkJwksUrl above — all
    # rendered together into one Secret (templates/gateway-discord-secret.yaml),
    # not a plain value. Do NOT commit real values here; set them per tenant
    # in deploy/helm/tenants/<tenant>.yaml instead, same discipline as
    # llm.tiers.<tier>.apiKey above.
    #
    # bots:
    #   - botToken: ""
    bots: []
  # -- Optional but required for any real voice call — gateway/
  # voice_stt_tts.go's SPEECH_API_KEY, the litellm-service API key
  # Gateway's own STT/TTS calls (transcribeAudio/synthesizeSpeechPCM)
  # authenticate with. Real, live 401 confirmed (2026-08-26) before this
  # value existed at all — nothing ever wired it, so every voice turn's
  # delivery activity failed with "No api key passed in." Same real key as
  # agentBrain.secret.litellmAPIKey / mcp-hub.embedding.apiKey (this
  # tenant's one litellm-service instance, one key) — rendered into a
  # Secret (templates/gateway-speech-secret.yaml), not a plain value, same
  # treatment as gateway.discord.bots above. Do NOT commit a real value
  # here; set it per tenant in deploy/helm/tenants/<tenant>.yaml.
  speechAPIKey: ""
  # -- Optional but required for any real voice call — gateway/
  # voice_stt_tts.go's TTS_VOICE, a Kokoro voice name
  # (voice_stt_tts.go's own comment: "deliberately has no default — Kokoro's
  # own voice-name convention isn't obviously guessable"). Real, live 500
  # confirmed (2026-08-26) once speechAPIKey (above) was fixed: litellm's
  # /v1/audio/speech route requires `voice` as a mandatory parameter
  # (`Router.aspeech() missing 1 required positional argument: 'voice'`),
  # so an unset TTS_VOICE isn't a graceful "use the provider's default" —
  # it's a hard failure on every single TTS call. "af_heart" verified for
  # real against the live kokoro-svc (a real 200, real synthesized audio),
  # and is also the default speaches' own /v1/realtime session reported —
  # not just a guess, but still a real per-tenant preference, not
  # hardcoded as this project's own default.
  ttsVoice: ""
  # -- Optional, opt-in — docs/components/gateway/discord-voice.md's Notes
  # Log, "filler injection" (ChatGPT-voice-mode-style acknowledgment
  # phrases, e.g. "Let me check that.", played instantly on utterance-end
  # to mask response latency rather than reduce it). false by default, same
  # convention as vadSidecar/realtimeStt below — a tenant that hasn't opted
  # in takes on no new startup dependency on kokoro-svc for pre-synthesizing
  # the filler phrase cache at all.
  voiceFillerEnabled: false
  # -- Optional — docs/components/gateway/discord-voice.md's "Resolved:
  # Silero VAD". Runs as a SECOND CONTAINER in this same pod, not a shared
  # cluster-wide service like whisper-svc/kokoro-svc: VAD is called
  # ~50x/sec per active speaker (every 20ms), a much higher frequency than
  # those services' once-per-utterance pattern, so colocating (localhost,
  # no cross-pod hop) is a deliberate exception to preferring shared
  # services, justified by that calling frequency specifically. Disabled
  # by default — voiceCaptureLoop falls back to energyVAD (no external
  # dependency at all) when this is off; when it's on and the sidecar
  # becomes unreachable at runtime, the design is fail-loud (tear down the
  # connection, refuse new /join attempts), not a silent fallback back to
  # energyVAD — see the doc for the reasoning.
  vadSidecar:
    enabled: false
    image:
      repository: "gcr.io/kumarabd/agent-harness/vad-sidecar"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8500
    resources: {}
  # -- Streaming STT (WhisperLive) — docs/components/gateway/discord-voice.md's
  # "Resolved: Gated Streaming STT Feed". A SEPARATE standalone cluster
  # service (infra/model/whisperlive/), GPU, specific to this deployment's
  # own cluster (nighthawk-pc) — an explicit opt-in URL, not an
  # assumed-present shared dependency. Disabled by default: voiceCaptureLoop
  # falls back entirely to the batch transcribeAudio path (voice_stt_tts.go).
  #
  # The gateway feeds this session audio ONLY while an utterance is in
  # progress (speakerBuffer.feedSTT), never on the dead air between
  # utterances — the earlier unconditional feed made it run large-v3 on
  # ambient room tone 24/7 and pinned the shared GPU (2026-08-29 Notes Log).
  realtimeStt:
    enabled: false
    # ws:// (or wss://), not http(s):// — a plain WebSocket protocol
    # (verified directly against the real deployed service), not an HTTP API
    # like whisper-svc/kokoro-svc.
    url: "ws://whisperlive-svc.core.svc:9090"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- agent-web (chat UI + agent-brain memory explorer) moved OUT of this
# chart entirely (2026-09-24) — it's now a single shared deployment in
# ../agent-harness-shared, fronted by a new shared router that resolves the
# right tenant per request by pure convention (2026-09-25: the tenant's
# Temporal namespace/Kubernetes namespace/Helm release name are all just a
# sanitized form of the caller's own Clerk user id — no Clerk Organizations,
# no per-tenant registration step), instead of one agent-web instance per
# tenant hardcoding this tenant's own agent-brain/gateway URLs. See
# ../agent-harness-shared/values.yaml's `agentWeb`/`router` blocks and
# docs/components/gateway/web.md. This tenant's own Gateway (gateway.* below)
# is UNCHANGED — still per-tenant, still holds only this tenant's own
# credentials; the router forwards to it by Service DNS name and never
# re-verifies/re-issues auth, it just resolves "which tenant".

# -- mcp-hub OAuth/header-token connection management: 2026-09-26, removed
# entirely from this chart. There is no more separate Go "connections"
# service or worker — mcp-hub itself now owns connection management end to
# end (its own Postgres-backed `connections` table, POST/DELETE
# /api/connections, GET /api/catalog), reached directly through the shared
# router's /connections/ proxy (router/internal/core/tenant.go's
# McpHubBaseURL()). Nothing to configure here; see the mcp-hub subchart's
# own values below instead.

# -- One self-hosted Postgres instance for this tenant — now a real subchart
# dependency (Bitnami's postgresql, same as ../../../infra/postgres's own
# pattern; see Chart.yaml) rather than a hand-rolled StatefulSet. Deliberately
# NOT a managed/shared Postgres service — see
# docs/components/multi-tenancy.md's 2026-08-14 revision for why. Provisions
# its own dedicated PVC (Bitnami's own default) rather than reusing
# tenantVolume below — a deliberate simplification over the earlier
# hand-rolled chart's subPath-on-the-shared-PV approach, traded for staying
# on the subchart's own well-tested defaults instead of fighting them.
#
# This is agent-harness's OWN role/database, created automatically by the
# subchart from auth.* below. agent-brain's separate role/database on this
# SAME server is provisioned by templates/postgres-init-roles-hook.yaml
# instead (mirrors ../../../infra/postgres's own init-roles Job, trimmed to
# the one extra role this chart needs).
postgresql:
  # -- 2026-09-27: this tenant already gets its own dedicated Kubernetes
  # namespace, so a release-name/tenant-slug prefix on top of "postgresql" is
  # pure redundancy, not a real collision guard — drop it. Every other
  # template/value in this chart, plus router/internal/core/
  # tenant.go's endpoint builders and automation/activities/
  # helm.go's buildTenantValues, assumes this exact bare name.
  fullnameOverride: "postgresql"
  # -- Custom Postgres image: a Bitnami-postgresql-compatible build with the
  # pgvector and timescaledb extensions baked in. Because it is not one of
  # Bitnami's own published images, the subchart's image-verification guard
  # (charts/postgresql NOTES.txt) rejects it unless we also opt in via
  # global.security.allowInsecureImages below.
  image:
    registry: "ghcr.io"
    repository: "realnighthawk/infra/postgres"
    tag: "latest"
    pullPolicy: IfNotPresent
  # -- Acknowledge the non-Bitnami image above. Scoped under `postgresql:` so
  # it only reaches the postgresql subchart, not the other subcharts.
  global:
    security:
      allowInsecureImages: true
  auth:
    # -- Do NOT commit real passwords here — this is the chart's own tracked
    # default values file. Set real values per tenant in
    # deploy/helm/tenants/<tenant>.yaml instead.
    postgresPassword: ""
    username: "agent_harness"
    password: ""
    database: "agent_harness"
  primary:
    persistence:
      size: "10Gi"
    # -- Postgres' stock max_connections is far too low for what shares this server: agent-brain, mcp-hub,
    # maps-engine, finance-engine, health-mcp and the base role each keep their own pool. At 25 the mcp-hub could not
    # start ("remaining connection slots are reserved for roles with the SUPERUSER attribute").
    extendedConfiguration: |-
      max_connections = 100

# -- Controls the init-roles Job and tenant-worker's own AGENT_BRAIN_* env
# vars (templates/tenant-worker-deployment.yaml) — NOT whether the `agent-brain`
# subchart itself deploys. It has no enabled-gating of its own (vendored
# as-is, see charts/agent-brain/), so it always deploys whenever this chart
# is installed — matching "this release deploys the whole tenant stack"
# rather than treating agent-brain as optional. Leave true unless you
# specifically want tenant-worker to skip calling it.
agentBrain:
  enabled: true
  # -- Password for the SECOND role/database the shared Postgres server
  # above hosts, for agent-brain — created by
  # templates/postgres-init-roles-hook.yaml, and the single source
  # templates/agent-brain-creds-secret.yaml uses to build agent-brain's own
  # postgres-dsn (no separate hand-composed DSN to keep in sync). Do NOT
  # commit a real value here.
  postgres:
    password: ""
  # -- The Go server's own IAM bootstrap credential (templates/
  # agent-brain-creds-secret.yaml's api-keys value, "<this value>:tenant-worker")
  # — for whoever calls that server directly (ops tooling, agent-web's Explorer
  # UI), NOT tenant-worker's own calling credential (that connection was removed
  # outright 2026-09-13 — see docs/components/memory-slot.md's Notes Log). Do NOT
  # commit a real value here.
  apiKey: ""
  # -- Not a secret — doubles as the retain server's bank_id (one bank per
  # tenant, docs/components/memory-slot.md). Was also the X-Agent-ID header the
  # Go server's own auth required; that connection is gone (2026-09-13), this
  # value's other use (bank_id) is why it's kept. Not a per-tenant value in the
  # usual sense — fine to leave at the chart default for every tenant.
  agentID: "agent-harness"
  # -- Not a secret — the user_id agent-brain's IAM binds tenant-worker's
  # apiKey to at bootstrap (templates/agent-brain-creds-secret.yaml's
  # api-keys value, "<apiKey>:<this value>"). internal/iam/service.go's
  # SeedFromEnv is insert-only: this is the identity every memory write
  # tenant-worker makes gets attributed to, permanently, from the first
  # deploy onward — it does NOT get reconciled later if changed (a key
  # already seeded keeps its original binding; changing this value only
  # affects a brand-new apiKey/deployment). For every write to land under
  # the SAME user_id the real Clerk-authenticated explorer UI queries by
  # (agent-brain's JWT auth path resolves user_id from the token's own
  # claims — internal/auth/credentials.go's tenantFromJWT — a completely
  # separate identity from this API-key bootstrap unless set to match), set
  # this to that real Clerk user_id. Left at the literal "tenant-worker"
  # placeholder by default since a real Clerk user_id isn't knowable at the
  # chart level.
  ownerUserID: "tenant-worker"

# -- agent-brain's retain MCP server (memory_retain/memory_recall/memory_reflect/
# mental models) — a second Deployment WITHIN the same agent-brain subchart release
# above (charts/agent-brain/templates/deployment-retain-mcp.yaml), not a separate
# release; there's no separate `enabled` flag here because it follows agentBrain.enabled.
agentBrainRetain:
  # -- tenant-worker's own calling credential (AGENT_BRAIN_RETAIN_API_KEY,
  # agent-brain-secret.yaml) AND the single source templates/
  # agent-brain-creds-secret.yaml uses to populate that Deployment's own
  # RETAIN_MCP_API_KEY — one value, both sides, same pattern as agentBrain.apiKey
  # above. Unlike agentBrain.apiKey this is genuinely optional — the retain-mcp
  # server runs with no auth check at all when unset (its own local-dev
  # convention, matching agentBrain's own auth.required=false posture). Do NOT
  # commit a real value here.
  apiKey: ""

# -- Real LLM config for ModelCall (tenant-worker/tenant_worker/llm.py). Only
# needed for turns with no _test_scripted_responses fixture row — pure
# fixture-based usage (e.g. workflows/scenarios/) never touches this, so
# it's fine to leave disabled for local/demo deployments.
#
# Every configured tier owns its OWN provider identity (2026-08-28):
# apiKey/baseURL/maxTokens live on the tier itself, so different tiers
# can genuinely point at different providers (fast at Groq, medium at
# Crusoe, expert at Anthropic, etc.). There is no cross-tier fallback
# and no shared provider default — every tier the deployment actually
# uses must set MODEL, apiKey, and baseURL. A tier left partially or
# fully empty surfaces at call time as a real error naming that
# specific tier (llm.py's "no model resolved" / llm_client.py's "no base
# url" checks), not a silent fallback.
#
# The AsyncOpenAI client is cached per (baseURL, apiKey) pair by
# llm_client.py, so a deployment where every tier points at the same
# provider still gets one shared HTTP connection pool for free — no
# per-call construction overhead in the common single-provider case.
llm:
  enabled: false
  # -- docs/components/model-registry.md — per-tier model + provider
  # configuration. Each tier is optional; a tier with model="" is treated
  # as unconfigured and never resolved to. `contextWindow` falls back to
  # a conservative 128000 default only when non-zero isn't set — that
  # fallback is for a tier that's otherwise fully configured but whose
  # provider hasn't published a context-window value, NOT for an unset
  # tier. `maxTokens` similarly defaults to 4096 when omitted.
  #
  # `provider` is REQUIRED per configured tier — one of "openai" or
  # "anthropic". "openai" covers every OpenAI-API-compatible endpoint
  # (real OpenAI, DeepSeek, Qwen/DashScope, Groq, OpenRouter, Crusoe,
  # etc.) — they all speak the same protocol and differ only in
  # baseURL + model name. "anthropic" is Anthropic's native Messages
  # API (a separate SDK, different request/response shape, handled by
  # tenant-worker/tenant_worker/providers/anthropic_provider.py). Any tier
  # with a non-empty `model` must also set `provider` and `apiKey`;
  # `baseURL` is required for provider=openai and optional for
  # provider=anthropic (that SDK has its own default).
  #
  # apiKey is REQUIRED per configured tier. Rendered into a chart-
  # managed Secret (templates/llm-secret.yaml) with one key per tier;
  # the Pod pulls each tier's key via `valueFrom.secretKeyRef`. Do NOT
  # commit real keys here — this is the chart's default values file.
  # Set real values per tenant in deploy/helm/tenants/<tenant>.yaml
  # instead (see that directory's README.md).
  #
  # costPerMillionTokens.* — docs/components/model-registry.md's pricing
  # table, in $/1M tokens (how providers publish pricing). "" (unset)
  # means no cost data for that rate, not free — budget-guardrails.md's
  # cost-based metrics stay honestly absent until a real number is filled
  # in, same as an unset context-window falls back rather than guessing.
  tiers:
    fast:
      provider: ""
      model: ""
      apiKey: ""
      baseURL: ""
      maxTokens: 4096
      contextWindow: 0
      costPerMillionTokens:
        input: ""
        output: ""
        cachedInput: ""
    medium:
      provider: ""
      model: ""
      apiKey: ""
      baseURL: ""
      maxTokens: 4096
      contextWindow: 0
      costPerMillionTokens:
        input: ""
        output: ""
        cachedInput: ""
    expert:
      provider: ""
      model: ""
      apiKey: ""
      baseURL: ""
      maxTokens: 4096
      contextWindow: 0
      costPerMillionTokens:
        input: ""
        output: ""
        cachedInput: ""

# -- agent-brain (hippocampus) subchart itself — components/memory-slot.md's
# memory backend, a real dependency published to
# oci://ghcr.io/realnighthawk/agent-brain (see Chart.yaml). Key name matches
# that chart's own `name:` exactly ("agent-brain", hyphenated) — this is how
# Helm passes values into a subchart, not a naming choice.
#
# Only the fields this deployment actually needs to override from that
# chart's own defaults are set here; everything else (cors, explorer, iam,
# config) keeps its vendored default. Do NOT commit real secret values here —
# set them per tenant in deploy/helm/tenants/<tenant>.yaml instead.
agent-brain:
  # -- Renders this subchart's resources as memory(-server/...) — named for
  # what it does rather than the vendored chart's own name ("agent-brain"),
  # and bare, no release-name/tenant-slug prefix (2026-09-27: this tenant
  # already gets its own dedicated Kubernetes namespace, so that prefix was
  # pure redundancy — see fullnameOverride below and postgresql's own comment
  # above). nameOverride kept alongside fullnameOverride purely so the
  # app.kubernetes.io/name label still reads "memory" too, not
  # "agent-brain" — fullnameOverride alone wouldn't affect that label.
  # Referenced directly (not computed) by
  # templates/tenant-worker-deployment.yaml's AGENT_BRAIN_RETAIN_BASE_URL and
  # router/internal/core/tenant.go's AgentBrainBaseURL.
  nameOverride: "memory"
  fullnameOverride: "memory"
  image:
    registry: "ghcr.io"
    repositoryOwner: "realnighthawk"
    tag: "internal"
  secret:
    # -- create: false + existingSecret below — postgres-dsn and api-keys are
    # NOT set here. Helm values can't reference other values (no
    # interpolation in values.yaml), so rather than hand-composing those as
    # separate literal strings that duplicate agentBrain.postgres.password /
    # agentBrain.apiKey above, templates/agent-brain-creds-secret.yaml
    # computes them (real Go-template interpolation) directly from those two
    # values into a Secret this subchart reads via existingSecret instead of
    # generating its own. Set the password/key once, in ONE place.
    create: false
    # -- Defaults to the platform's own shared litellm-service master key —
    # every tenant's embedding calls go through that one in-cluster instance
    # (http://litellm-service.core.svc:4000, see embed.litellmBaseURL below)
    # unless a tenant brings their own external embedding endpoint, in which
    # case override this with that provider's key
    # (deploy/helm/tenants/<tenant>.yaml). 2026-09-27: this used to default to
    # "" and be marked REQUIRED, with the self-serve onboarding form
    # generating a random per-tenant string for it — that could never work,
    # since this litellm-service has no per-tenant virtual-key system, only
    # this one static master key (core namespace's litellm-config
    # ConfigMap). automation/activities/helm.go's
    # buildTenantValues now only overrides this when the requester actually
    # opted into an external endpoint, so this default is what most tenants
    # actually run on.
    litellmAPIKey: "sk-change-this-to-a-secure-key"
    # -- REQUIRED. Any random per-tenant secret; do not reuse across tenants.
    jwtSecret: ""
    # -- Guards agent-brain's /admin/reset-memory endpoint. Explicitly
    # overridden to empty here — the vendored subchart's own default
    # ("random-admin-secret") is a known/insecure placeholder that would
    # otherwise silently enable that endpoint. Empty means the endpoint
    # always 401s (that chart's own documented behavior) and agent-brain's
    # env template skips emitting ADMIN_SECRET entirely, so no matching key
    # is needed in templates/agent-brain-creds-secret.yaml either. Set a real
    # value per tenant (deploy/helm/tenants/<tenant>.yaml) only if that
    # endpoint is actually needed.
    adminSecret: ""
  # -- REQUIRED (2026-09-26: confirmed by reading the vendored subchart's own
  # templates/_helpers.tpl — this renders straight into TEMPORAL_ADDRESS/
  # LLM_BASE_URL etc. with no fail guard and no safe default, so an unset
  # value here is a silent runtime break, not a graceful skip). Chat-
  # completion provider for agent-brain's retain/reflect pipeline (entity/
  # fact/rule extraction — see agent-brain's own charts/agent-brain/
  # values.yaml comment on llm for why this is a direct provider call, not
  # the shared LiteLLM proxy). baseURL/model are plain values here (not
  # secrets); the actual API key is NOT set here — templates/agent-brain-
  # creds-secret.yaml computes it directly from llm.tiers.medium.apiKey
  # below (retain is treated as a medium-tier consumer 2026-08-28, since
  # every tier now owns its own credential — no shared provider key exists
  # anymore; keeping retain coupled to one specific tier is deliberate).
  #
  # NOT nested under a "mining" key — the vendored subchart's own
  # values.yaml has this as a plain top-level `llm:` block, consumed
  # directly as `.Values.llm.baseURL`/`.model` (charts/agent-brain/
  # templates/_helpers.tpl's temporalWorkerEnv). An earlier version of this
  # file nested it under `mining:`, which the subchart has never actually
  # read — found by cross-checking against deploy/helm/tenants/abishekk.yaml
  # (which had always set the correct, unnested path) while auditing why
  # self-serve onboarding's generated values were missing this entirely
  # (automation/activities/helm.go).
  llm:
    baseURL: ""
    model: ""
  # -- Fixed name, not per-release — safe because each tenant already gets
  # its own Kubernetes namespace (deploy/helm/tenants/README.md's
  # `-n <k8s-namespace>`), so no cross-tenant collision risk. Must match
  # templates/agent-brain-creds-secret.yaml's metadata.name exactly.
  existingSecret: "agent-brain-creds"
  embed:
    enabled: true
    litellmBaseURL: "http://litellm-service.core.svc:4000"
    model: "bge-m3"
    dim: 1024
  # -- REQUIRED (2026-09-26: confirmed by reading the vendored subchart's own
  # templates/_helpers.tpl — these render straight into TEMPORAL_ADDRESS/
  # TEMPORAL_NAMESPACE/TEMPORAL_RETAIN_TASK_QUEUE with no fail guard and no
  # safe default, so leaving any of them unset is a silent runtime break, not
  # a graceful skip). address/namespace must match temporal.address/
  # namespace above exactly — every tenant now shares one Temporal namespace
  # with the shared pool (docs/components/multi-tenancy.md's "Resolved:
  # Shared Temporal Namespace, Per-Tenant Task Queues"), so this is no longer
  # a per-tenant value, just duplicated here because it's the SUBCHART's own
  # separate values namespace (Helm can't compute a subchart value from
  # .Release.Name in a template the way this chart's own configmap.yaml
  # computes its OWN queue names — this has to be an explicit value).
  # retainTaskQueue MUST be unique per tenant (unlike namespace/address) —
  # it's the only thing keeping one tenant's agent-brain retain worker from
  # picking up another tenant's own retain workflow now that the namespace
  # is shared. Convention: "<release-name>-memory".
  temporal:
    address: ""
    namespace: ""
    retainTaskQueue: ""
  cors:
    enabled: false

# -- Controls the init-roles Job and (once native/Python-side dispatch code
# exists — not yet built, see docs/components/tool-registry.md's Open
# Questions) tenant-worker's own calls into it — NOT whether the `mcp-hub`
# subchart itself deploys, same shape as agentBrain above. Leave true unless
# you specifically want mcp-hub to not be part of this tenant's stack.
mcpHub:
  enabled: true
  # -- Password for the THIRD role/database the shared Postgres server above
  # hosts, for mcp-hub — created by templates/postgres-init-roles-hook.yaml.
  # Unlike agent-brain, mcp-hub's own chart has no existingSecret escape
  # hatch (its Secret is unconditionally self-generated from
  # mcp-hub.database.* below) — so this value has NO single-source link to
  # mcp-hub.database.password the way agent-brain's postgres-dsn does; the
  # two literally must be set to the same value by hand. Do NOT commit a
  # real value here.
  postgres:
    password: ""

# -- mcp-hub subchart itself — docs/components/tool-registry.md's
# "Resolved: Leverage mcp-hub" / "Resolved: Per-Tenant Deployment", published
# to oci://ghcr.io/realnighthawk/infra/charts/mcp-hub (private registry —
# `helm registry login ghcr.io` required before `helm dependency update`).
# Key name matches that chart's own `name:` exactly, same reasoning as
# agent-brain above.
#
# SECURITY: that chart's own tracked default values.yaml bakes in several
# live-looking credentials under `manifests` (a GitHub PAT among them,
# docs/components/tool-registry.md's Notes Log) — verified by rendering,
# Helm's normal map-merge does NOT clear a subchart's default map entries
# just because the parent sets the same key to `{}`; only an explicit `null`
# per child key actually deletes it. Every default manifest entry that
# chart ships is nulled out below for exactly that reason — do not remove
# these nullifications without confirming (by rendering, not assuming) that
# the upstream chart's own defaults are no longer live secrets. Add back only
# the manifests this tenant actually needs, with this tenant's own
# credentials, in deploy/helm/tenants/<tenant>.yaml.
#
# Requires mcp-hub chart >= 0.1.1 (Chart.yaml's dependencies) — earlier
# versions hardcode their fullname to the bare release name and ignore
# nameOverride/fullnameOverride entirely.
mcp-hub:
  # -- Renders this subchart's resources as bare "tools" — this tenant's
  # tool-registry instance, named for what it does, with no release-name/
  # tenant-slug prefix (2026-09-27: pure redundancy on top of this tenant's
  # own dedicated namespace — see postgresql's own comment above). Requires
  # >= 0.1.1 (see above). nameOverride kept alongside fullnameOverride so the
  # app.kubernetes.io/name label still reads "tools" too. Referenced directly
  # (not computed) by templates/tenant-worker-deployment.yaml's MCP_HUB_URL
  # and EMBEDDING_API_KEY, and router/internal/core/tenant.go's
  # McpHubBaseURL.
  nameOverride: "tools"
  fullnameOverride: "tools"
  database:
    name: "mcphub"
    user: "mcphub"
    # -- Do NOT commit a real value here — see mcpHub.postgres.password
    # above; the two must match.
    password: ""
    # -- REQUIRED, per-tenant (can't be set here — Helm values can't
    # reference .Release.Name, and unlike the Bitnami postgresql subchart's
    # generated Secret, mcp-hub's own chart has no existingSecret mechanism
    # to route a computed value through). Set to
    # "{release-name}-postgresql.{k8s-namespace}.svc.cluster.local" in
    # deploy/helm/tenants/<tenant>.yaml, matching whatever release
    # name/namespace that tenant is actually installed under.
    host: ""
  embedding:
    # -- Same platform-shared litellm-service master key as
    # agentBrain.secret.litellmAPIKey above — see that field's comment. Only
    # override this (deploy/helm/tenants/<tenant>.yaml) when the tenant
    # brings their own external embedding endpoint instead of the platform's.
    apiKey: "sk-change-this-to-a-secure-key"
  manifests:
    agent-brain.yaml: null
    maps-engine.yaml: null
    notion.yaml: null
    trek.yaml: null
    finance.yaml: null
    exa.yaml: null
    github.yaml: null
    grafana.yaml: null
    health.yaml: null
    utility.yaml: null
    abrp.yaml: null

# -- The shared PV for this tenant: the session filesystem tree
# (docs/components/session-filesystem.md). No longer also hosts Postgres's
# data directory — the postgresql subchart above provisions its own
# dedicated PVC instead (see that block's comment).
tenantVolume:
  enabled: true
  size: "10Gi"
  # -- ReadWriteOnce by default, matching tenantWorker.replicaCount's own
  # default of 1 — this cluster's actual StorageClass (Rancher's
  # rancher.io/local-path) only supports ReadWriteOnce/ReadWriteOncePod
  # anyway. 2026-09-27: this used to default to ReadWriteMany, which every
  # self-serve-onboarded tenant's worker Pod would then get stuck Pending on
  # forever (ProvisioningFailed: "NodePath only supports ReadWriteOnce and
  # ReadWriteOncePod") — abishekk.yaml already carried the correct override,
  # this default just never matched it. Bump tenantWorker.replicaCount above
  # 1 for a real multi-replica worker fleet ONLY on a cluster whose
  # StorageClass is file-storage-backed (EFS, Filestore, Azure Files, or an
  # equivalent CSI driver) — set accessMode back to ReadWriteMany and
  # storageClassName to that class together when you do.
  storageClassName: ""
  accessMode: "ReadWriteOnce"
  sessionsSubPath: "sessions"
  # -- docs/components/user-input.md's PERMISSION_LIST — disjoint from
  # sessionsSubPath above so a runtime-edited policy file never collides
  # with real session data. Mounted at /config; TOOL_PERMISSION_LIST_FILE
  # (tenant-worker-deployment.yaml) points at permission_list.json inside
  # it. The file's own content is not a Helm value — edited directly on the
  # PV at runtime, starts empty (missing file) until someone writes one.
  configSubPath: "config"

# -- maps-engine: each tenant's own journeys / garage / place search / route planning service (the maps-engine repo).
# ON for every tenant by default. One instance per tenant, reached ONLY through the shared router at /maps/ — it
# trusts the router's verified-user header instead of verifying tokens itself, so the NetworkPolicy below is part of
# its auth boundary, not decoration. Set `enabled: false` in a tenant file to opt a tenant out.
mapsEngine:
  enabled: true
  image:
    repository: "ghcr.io/realnighthawk/maps-engine"
    # -- Pin to a published sha-… tag for a reproducible rollout; "latest" follows main.
    tag: "latest"
    pullPolicy: IfNotPresent
  # -- Exactly one replica: the live-update WebSocket hub is process-local. Raise only after moving it to a shared bus.
  replicaCount: 1
  port: 8080
  # -- Embedded MCP (Streamable HTTP) listener, reached only by this tenant's own mcp-hub (see networkPolicy).
  mcpPort: 8090
  # -- Pull secrets for the maps-engine image (it is published to GHCR, not this cluster's usual registry). Leave empty
  # when the package is public. Example: [{ name: ghcr-pull }].
  imagePullSecrets: []
  postgres:
    # -- Leave empty (the default): maps-engine gets its OWN database, "mapsengine", with its own role, inside this
    # tenant's Postgres (templates/postgres-init-roles-hook.yaml creates both and enables TimescaleDB in it). The role's
    # password is then derived from postgresql.auth.postgresPassword, so nothing extra to configure per tenant.
    password: ""
  # -- Platform-wide provider keys (Places search, Routes, Weather; Open Charge Map for EV stops), shared by every
  # tenant and never sent to a client. Hardcoded here on purpose so every tenant gets them; restrict both keys to
  # their APIs in the provider consoles. A tenant file may override either.
  googleMapsApiKey: "AIzaSyDUvX2hV6RYLJKpg15EMvs0P1tljjxHA8o"
  ocmApiKey: "1fdbe615-4166-4239-b31b-98214a62f9ae"
  # -- Empty = the tenant's own agentBrain.ownerUserID (the Clerk user who owns the tenant), so maps-engine refuses
  # every other user even if a request is somehow misrouted.
  ownerSub: ""
  networkPolicy:
    enabled: true
    # -- Namespace the shared router (the only caller allowed to reach maps-engine) runs in. Empty (the default)
    # matches the router's pods by label in ANY namespace, which works wherever the shared chart was installed; set it
    # to that release's namespace to pin the policy to exactly that namespace.
    routerNamespace: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# -- health-mcp: each tenant's own health MCP server and database. Finance is served by financeEngine below.
# The health service is reachable only from this tenant's mcp-hub (NetworkPolicy).
dataMcps:
  health:
    enabled: true
    image: { repository: "ghcr.io/realnighthawk/infra/health-mcp", tag: "latest", pullPolicy: IfNotPresent }
    dbPassword: ""
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# -- finance-engine: each tenant's own spending ledger (the finance-engine repo): spends, categories, tags, merchants,
# insights, and the API behind the Treasure iOS/Android apps. One instance per tenant, reached through the shared
# router at /finance/ and through this tenant's mcp-hub at /mcp. Both supply the verified-user header, so the
# NetworkPolicy below is part of its auth boundary. Data lives in its own "financeengine" database (TimescaleDB
# and pgvector). The former finance-mcp's "finance" database is preserved for explicit migration.
financeEngine:
  enabled: true
  image:
    repository: "ghcr.io/kumarabd/finance-engine"
    # -- Pin to a published sha-… tag for a reproducible rollout; "latest" follows main.
    tag: "latest"
    pullPolicy: IfNotPresent
  # -- One replica is plenty; it is stateless, so this can be raised freely.
  replicaCount: 1
  port: 8091
  # -- Pull secrets for the image (a personal GHCR package is private by default). Leave empty when it is public.
  # Example: [{ name: ghcr-pull }].
  imagePullSecrets: []
  postgres:
    # -- Leave empty (the default): derived from postgresql.auth.postgresPassword (same scheme as mapsEngine.postgres.password).
    password: ""
  # -- Browser origins allowed to make state-changing calls through the router (agent-web). Native apps send no Origin
  # and need no entry. Exact origins, or one "https://*.domain.tld" wildcard per entry (any subdomain, no port; needs a finance-engine
  # build that has internal/transport/origins.go — older images treat the "*" literally and match nothing). EVERY browser call is a POST (/operations/<name>), so with
  # this empty finance-engine answers each one with 403 "cross-origin request detected". Defaults to every
  # nighthawklabs.org subdomain, which covers agent-web (the automation worker's WEB_ORIGIN).
  trustedOrigins: ["https://*.nighthawklabs.org"]
  networkPolicy:
    enabled: true
    # -- Namespace where the shared router runs. Empty matches router pods by label in any namespace.
    # This tenant's mcp-hub is also allowed to reach finance-engine in the tenant namespace.
    routerNamespace: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
