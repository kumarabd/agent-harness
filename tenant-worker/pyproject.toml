[project]
name = "agent-harness-tenant-worker"
version = "0.1.0"
description = "Tenant worker — Temporal activities (ModelCall, ToolCall, Persist, CompressContext, and the rest) for this tenant's own activity-polling process."
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.7,<2",
    "asyncpg>=0.29,<1",
    "openai>=1.40,<2",
    # docs/components/model-registry.md — Anthropic is a first-class
    # provider alongside OpenAI-compatible ones. providers/anthropic_provider.py
    # uses this SDK; DeepSeek/Qwen/Groq/OpenRouter/Crusoe all speak the
    # OpenAI-compatible protocol and use the `openai` package above instead.
    "anthropic>=0.40,<1",
    # docs/components/memory-slot.md — direct agent-brain MCP integration
    # (agent_brain.py). Same SDK also used for mcp-hub (mcp_hub.py).
    # Official SDK, not a hand-rolled JSON-RPC/streamable-HTTP
    # session-handshake implementation.
    "mcp>=1.0,<3",
    # mcp_hub.py's subscription calls reach mcp-hub's management API directly.
    # httpx already arrives transitively via `mcp`, but it is imported here by name,
    # so it is declared here by name.
    "httpx>=0.27,<1",
    # docs/components/tool-registry.md, "Resolved: Native-Tool Discovery" —
    # shell_hub.py's in-process hybrid vector+FTS index. Verified real
    # (https://github.com/alibaba/zvec, Apache-2.0) before adopting.
    "zvec>=0.6,<1",
]

[project.optional-dependencies]
# Same dev extra as the family's other Python services (infra/mcp-hub,
# infra/finance-mcp, infra/health-mcp). No testcontainers: this suite covers what is
# reachable without a database, so it needs nothing a plain interpreter cannot do.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tenant_worker*"]

[tool.pytest.ini_options]
# Matches the family (infra/mcp-hub). Every async test still carries an explicit
# @pytest.mark.asyncio anyway — belt-and-braces, and what mcp-hub does.
asyncio_mode = "auto"
